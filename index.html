<body>

<script>
// =====================
// CONFIG - VERTICAL
// =====================
const SHEET_URL =
  "https://script.google.com/macros/s/AKfycbyxlO60asW5Jc8tHtjtSqk8-tUTSxJwwDZ-i0oN-Jgqn5wsmg7l0a70jFD7rZssUD4IOw/exec";

const WHATSAPP_NUM =
  "5491176529179";

const LOGO_URL =
  "https://res.cloudinary.com/dlnrsadbc/image/upload/q_auto,f_auto,w_320,c_limit/v1789653853/hugo_logo_transparente_epomls.png";

const DRIVE_ID =
  "1NGDJ2pUuDDSM8g9MP6lQaH45KfVe1MPf";

const DRIVE_PREVIEW =
  `https://drive.google.com/file/d/${DRIVE_ID}/preview`;

const DRIVE_VIEW =
  `https://drive.google.com/file/d/${DRIVE_ID}/view`;

const FALLBACK = {
  Pack: "Pack 3",
  "Producto / Pack": "Transformación Total",
  detail: "Curso 01 + 02 + 03 + Sesión 1:1",
  "Subtítulo": "El sistema definitivo para validar sin construir de más. Incluye sesión 1:1.",
  "Que cursos incluye?": "Curso 01 + 02 + 03 + Sesión 1:1",
  "Precio Total (100%)": 897,
  "Precio Total (50% por pago unico)": 448.5,
  "Opción 3 Cuotas (Mensual)": "$256",
  "Opción 6 Cuotas (Mensual)": "$128",
  offerNote: "RECOMENDADO • + SESIÓN 1:1 • 50% OFF",
  imageUrl: LOGO_URL,
  buyUrlContado: "https://checkout.dodopayments.com/buy/pdt_example3",
  buyUrl3Cuotas: "https://checkout.dodopayments.com/buy/pdt_example3_3",
  buyUrl6Cuotas: "https://checkout.dodopayments.com/buy/pdt_example3_6"
};
</script>

<header class="w-full border-b border-white/[0.06] sticky top-0 z-20 bg-[#0A1E1E]/85 backdrop-blur-xl">
  <div class="mx-auto max-w- px-5 h- md:h- flex items-center justify-between">
    <a href="https://hugo85ar.github.io/catalogo-promociones/" class="inline-flex items-center gap-2 text- uppercase tracking-[0.14em] font-semibold text-white/50 border border-white/10 rounded-full px-4 h-9">← Volver</a>
    <img id="logo-img" alt="【entity-Hugo¦canonical_name=Hugo】 Alvigini" class="h-14 md:h-20" />
  </div>
</header>

<section class="mx-auto max-w- px-5 pt-12 pb-10">
  <div class="flex flex-col md:flex-row justify-between items-center gap-8">
    <div class="flex-1 order-2 md:order-1">
      <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-[#4EEED8]/10 border border-[#4EEED8]/20 text- uppercase tracking-[0.14em] text-[#4EEED8] font-bold mb-5">
        <span class="w-1.5 h-1.5 rounded-full bg-[#4EEED8] animate-pulse"></span>
        50% OFF contado - Solo Pack 3
      </div>
      <h1 class="text- md:text- leading-[0.95] font-[800] uppercase">
        PILETA 3: PACK 3
        <span class="block text-white/40">TRANSFORMACIÓN TOTAL</span>
      </h1>
      <p class="mt-4 text- text-white/60 max-w-">Esta landing muestra solo Pack 3 para la pileta de $2500. Pago único con 50% OFF.</p>
    </div>
    <div class="w- md:w- order-1 md:order-2">
      <div class="aspect-[9/16] rounded- overflow-hidden bg-[#0A1E1E] border border-white/10 shadow-[0_24px_80px_rgba(0,0,0,0.4)]">
        <iframe id="drive-frame" class="w-full h-full" allowfullscreen></iframe>
      </div>
      <a id="drive-link" target="_blank" class="mt-3 inline-flex text- text-white/40 underline">Si no carga, ver video →</a>
    </div>
  </div>
</section>

<section class="mx-auto max-w- px-5 pb-10">
  <h2 class="text- uppercase tracking-[0.16em] font-bold text-[#4EEED8] border-b border-[#4EEED8]/20 pb-2 mb-6">Pack seleccionado para Pileta 3</h2>
  <div id="packs-container" class="flex flex-col gap-5"></div>
</section>

<div class="fixed bottom-0 left-0 w-full z-50 px-4 py-3 bg-[#0A1E1E]/95 backdrop-blur-xl border-t border-white/10">
  <div class="mx-auto max-w- text-center">
    <div id="status-msg" class="hidden mb-2.5 px-4 py-2 rounded-full bg-[#4EEED8]/10 border border-[#4EEED8]/20 text- text-[#4EEED8] font-semibold"></div>
    <div id="selected-info" class="text- text-white/50 mb-2.5 truncate">Cargando Pack 3...</div>
    <button id="checkout-btn" disabled class="w-full h- rounded-full bg-[#FF5A1F] text-white font-bold disabled:opacity-40">🔒 Completar mi compra</button>
    <button id="wsp-btn" class="mt-2.5 text- text-white/40 underline">¿Dudas? Hablar con 【entity-Hugo¦canonical_name=Hugo】 por 【entity-WhatsApp¦canonical_name=WhatsApp】 →</button>
  </div>
</div>

<script>
const packsContainer = document.getElementById('packs-container');
const selectedInfo = document.getElementById('selected-info');
const statusMsg = document.getElementById('status-msg');
const checkoutBtn = document.getElementById('checkout-btn');
const wspBtn = document.getElementById('wsp-btn');
const logoImg = document.getElementById('logo-img');
const driveFrame = document.getElementById('drive-frame');
const driveLink = document.getElementById('drive-link');

let selectedPlan = null;
let selectedUrl = null;
let selectedName = null;
let userName = "";

logoImg.src = LOGO_URL;
driveFrame.src = DRIVE_PREVIEW;
driveLink.href = DRIVE_VIEW;

function formatPrice(v) {
  if (v == null) return "$--";
  const s = String(v).trim();
  return s.includes("$") ? s : "$" + s;
}

function extractPrice(str) {
  const m = String(str).match(/\$[\d,.]+/);
  return m ? m[0] : str;
}

function showStatus(t) {
  statusMsg.textContent = t;
  statusMsg.classList.remove('hidden');
  setTimeout(() => statusMsg.classList.add('hidden'), 2500);
}

function buildData(raw) {
  return {
    codigo: (raw.Pack || "Pack 3").trim(),
    producto: (raw["Producto / Pack"] || "Transformación Total").trim(),
    detail: raw.detail || "Curso 01 + 02 + 03 + Sesión 1:1",
    subtitulo: raw["Subtítulo"] || "El sistema definitivo para validar sin construir de más. Incluye sesión 1:1.",
    incluye: raw["Que cursos incluye?"] || "Curso 01 + 02 + 03 + Sesión 1:1",
    img: raw.imageUrl || LOGO_URL,
    regular: raw["Precio Total (100%)"] || 897,
    promo: raw["Precio Total (50% por pago unico)"] || 448.5,
    cuota3: raw["Opción 3 Cuotas (Mensual)"] || "$256",
    cuota6: raw["Opción 6 Cuotas (Mensual)"] || "$128",
    urlContado: raw.buyUrlContado || "",
    url3: raw.buyUrl3Cuotas || "",
    url6: raw.buyUrl6Cuotas || "",
    nombre: `${(raw.Pack || "Pack 3")} - ${(raw["Producto / Pack"] || "Transformación Total")}`.trim(),
    offerNote: raw.offerNote || "RECOMENDADO • + SESIÓN 1:1 • 50% OFF"
  };
}

function renderPack(p) {
  return `
    <div class="relative rounded- border p-5 bg-[#102E2E] border-[#4EEED8]">
      <span class="absolute -top-3 left-6 px-3 py-1 rounded-full bg-[#4EEED8] text-[#0A1E1E] text- font-bold">RECOMENDADO • + SESIÓN 1:1</span>
      <div class="flex flex-col md:flex-row gap-5">
        <img src="${p.img}" class="w- h- md:w- md:h- rounded- object-contain bg-[#0A1E1E] border border-white/[0.06] shrink-0" />
        <div class="flex-1">
          <h3 class="text- font-bold">${p.codigo} - ${p.producto}<span class="block text- font-medium text-white/45 mt-1">${p.detail}</span></h3>
          <div class="mt-2 text- text-[#4EEED8] font-semibold">${p.subtitulo}</div>
          <div class="mt-2 text- text-white/55"><span class="text-white/30">Incluye:</span> ${p.incluye}</div>
          <div class="mt-4 rounded- border border-dashed border-[#4EEED8]/30 bg-[#4EEED8]/[0.06] p-4">
            <div class="text- line-through text-white/30">Valor real: ${formatPrice(p.regular)}</div>
            <div class="mt-2 text- font-[800] text-[#4EEED8]">⚡ HOY 50% OFF Contado: ${formatPrice(p.promo)}</div>
            <div class="mt-1 text- text-white/50">3x ${formatPrice(p.cuota3)} | 6x ${formatPrice(p.cuota6)}</div>
          </div>
          <div class="mt-5 flex flex-col gap-2.5">
            <button onclick="selectPlan('Pago Contado (50% OFF) - ${formatPrice(p.promo)}', '${p.urlContado}')" class="w-full h- rounded-full border flex items-center justify-between px-5 text- ${selectedPlan?.includes('Contado') ? 'bg-[#4EEED8]/15 border-[#4EEED8] text-[#4EEED8] font-bold' : 'bg-white/[0.04] border-white/10 text-white/70'}">
              <span>💥 Pago Contado - 50% OFF</span><strong>${formatPrice(p.promo)}</strong>
            </button>
            <button onclick="selectPlan('3 Cuotas de ${formatPrice(p.cuota3)}', '${p.url3}')" class="w-full h- rounded-full border flex items-center justify-between px-5 text- ${selectedPlan?.includes('3 Cuotas') ? 'bg-[#4EEED8]/15 border-[#4EEED8] text-[#4EEED8]' : 'bg-white/[0.04] border-white/10 text-white/60'}">
              <span>📅 En 3 Cuotas</span><strong>${formatPrice(p.cuota3)} c/u</strong>
            </button>
            <button onclick="selectPlan('6 Cuotas de ${formatPrice(p.cuota6)}', '${p.url6}')" class="w-full h- rounded-full border flex items-center justify-between px-5 text- ${selectedPlan?.includes('6 Cuotas') ? 'bg-[#4EEED8]/15 border-[#4EEED8] text-[#4EEED8]' : 'bg-white/[0.04] border-white/10 text-white/60'}">
              <span>📅 En 6 Cuotas</span><strong>${formatPrice(p.cuota6)} c/u</strong>
            </button>
          </div>
          <div class="mt-4 rounded- bg-[#0A1E1E] border border-white/[0.06] p-4">
            <div class="text- uppercase text-white/40 mb-2">¿Dudas? Nombre (opcional)</div>
            <input type="text" placeholder="Ej: Alejandro" oninput="userName=this.value" class="w-full h- px-4 rounded-full bg-white/5 border border-white/10 text-white placeholder:text-white/30 text-" />
          </div>
        </div>
      </div>
    </div>
  `;
}

window.selectPlan = function(plan, url) {
  selectedPlan = plan;
  selectedUrl = url;
  selectedName = buildData(FALLBACK).nombre;
  selectedInfo.innerHTML = `Seleccionado: <span style="color:#4EEED8;font-weight:600">${selectedName}</span> <span style="color:rgba(255,255,255,.3)">(${plan})</span>`;
  checkoutBtn.disabled = false;
  const price = extractPrice(plan);
  checkoutBtn.textContent = plan.includes('Contado') ? `🔒 Sí, quiero Pack 3 por ${price}` : `🔒 Completar mi compra - ${plan}`;
  showStatus(`✓ ${selectedName} • ${plan} seleccionado`);
  loadPack(FALLBACK);
};

function loadPack(raw) {
  const p = buildData(raw);
  packsContainer.innerHTML = renderPack(p);
}

async function init() {
  try {
    const res = await fetch(SHEET_URL, { cache: "no-store" });
    const txt = await res.text();
    const data = JSON.parse(txt);
    let list = Array.isArray(data) ? data : [];
    let pack3 = list.find(x => (x.Pack || "").toLowerCase().includes("3")) || FALLBACK;
    loadPack(pack3);
    selectPlan(`Pago Contado (50% OFF) - ${formatPrice(pack3["Precio Total (50% por pago unico)"] || 448.5)}`, pack3.buyUrlContado || FALLBACK.buyUrlContado);
    console.log("DATA SHEET:", data);
  } catch (e) {
    loadPack(FALLBACK);
    selectPlan(`Pago Contado (50% OFF) - ${formatPrice(FALLBACK["Precio Total (50% por pago unico)"])}`, FALLBACK.buyUrlContado);
  }
}

checkoutBtn.addEventListener('click', () => {
  if (!selectedUrl) return;
  window.open(selectedUrl, "_blank");
});

wspBtn.addEventListener('click', () => {
  let text = !selectedPlan
    ? "Hola Hugo! Estoy viendo el Pack 3 y tengo una duda, me ayudás?"
    : `Hola Hugo! Me interesa:\n\n*Pack:* ${selectedName}\n*Modalidad:* ${selectedPlan}\n${userName ? `*Nombre:* ${userName}\n` : ""}\nTengo una duda antes de pagar, me ayudás?`;
  window.open(`https://wa.me/${WHATSAPP_NUM}?text=${encodeURIComponent(text)}`, "_blank");
});

init();
</script>
</body>
