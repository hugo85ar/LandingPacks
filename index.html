<body>

  <header class="hero-main">
    <div class="hero-content-wrapper">
      <div class="top-nav-row">
        <a href="https://hugo85ar.github.io/catalogo-promociones/" class="btn-volver">
          ← Volver al Inicio
        </a>
      </div>
      <img
        src="https://res.cloudinary.com/dlnrsadbc/image/upload/q_auto,f_auto,w_400/v1778980849/logo_hugo_alvigini_transparente_jodgue_z1tldp.webp"
        alt="Hugo Alvigini"
        class="logo-hero"
        fetchpriority="high"
        width="400"
        height="100"
      >
      <h1>Packs & Programas Integrales</h1>
      <p>Sistemas para escalar tu negocio digital al siguiente nivel</p>
    </div>
  </header>

  <main id="courses-container">
    <div class="section-header">
      <h2>Elegí tu Pack de Cursos</h2>
    </div>
    <div id="pack-list">
      <div class="skeleton-card" style="padding:20px; background:rgba(16,16,38,0.7); border-radius:12px; min-height:150px;">
        Cargando packs...
      </div>
    </div>
  </main>

  <footer>
    <div class="payment-info">
      <img
        src="https://res.cloudinary.com/dlnrsadbc/image/upload/q_auto,f_auto,w_350/v1778980376/pago_moneda_local_ms2q3z.webp"
        alt="Pagar en Moneda Local Argentina y Paraguay"
        class="banner-pagos"
        loading="lazy"
        width="350"
        height="70"
      >
    </div>
    <p>&copy; 2026 Hugo Alvigini. Todos los derechos reservados.</p>
  </footer>

  <div class="sticky-bar">
    <div class="selected-label" id="selected-label">
      Seleccioná un pack y modalidad de pago
    </div>
    <div class="action-btn-group">
      <button class="btn-action btn-lemon" id="btn-lemon" disabled>
        💳 Enviar Datos de Inscripción
      </button>
    </div>
  </div>

<script>
  // ============================================================
  // CONFIGURACIÓN
  // ============================================================

  const APPSCRIPT_BASE = 'https://script.google.com/macros/s/AKfycbxTGQQZWDLXcfMtMbOH9c98PfH5cQgu5lIzK6jw9vBP-9NLR_RlmX28fDSpd92UZbZU/exec';
                     
  const WA_NUMBER = '5491176529179';

  let selectedCourse = null;
  let selectedModalidad = null;
  let coursesDataGlobal = [];


  // ============================================================
  // SELECCIONAR MODALIDAD Y MOSTRAR FORMULARIO INTERNO
  // ============================================================

  function selectModalidad(index, modalidad, event) {
    if (event) {
      event.stopPropagation();
    }

    const course = coursesDataGlobal[index];
    if (!course) {
      console.error('No se encontró el curso seleccionado.');
      return;
    }

    const headers = Object.keys(course);
    const nombre =
      course['Nombre'] ||
      course['Titulo'] ||
      course['title'] ||
      course[headers[1]] ||
      'Pack';

    selectedCourse = nombre;
    selectedModalidad = modalidad;

    document
      .querySelectorAll('.course-card')
      .forEach(function(card, idx) {
        const formContainer = card.querySelector('.checkout-form-container');
        
        if (idx === index) {
          card.classList.add('selected');
          if (formContainer) formContainer.classList.add('active');

          card
            .querySelectorAll('.pay-option-btn')
            .forEach(function(btn) {
              if (btn.dataset.modalidad === modalidad) {
                btn.classList.add('active');
              } else {
                btn.classList.remove('active');
              }
            });
        } else {
          card.classList.remove('selected');
          if (formContainer) formContainer.classList.remove('active');
          card
            .querySelectorAll('.pay-option-btn')
            .forEach(function(btn) {
              btn.classList.remove('active');
            });
        }
      });

    updateStickyBar();
  }


  // ============================================================
  // BARRA INFERIOR
  // ============================================================

  function updateStickyBar() {
    const label = document.getElementById('selected-label');
    const btnWa = document.getElementById('btn-whatsapp');
    const btnLemon = document.getElementById('btn-lemon');

    if (!label || !btnWa || !btnLemon) return;

    if (!selectedCourse || !selectedModalidad) {
      label.innerHTML = selectedCourse
        ? `Pack: <span>${escapeHtml(selectedCourse)}</span> — <span style="color:#00e5ff">Elegí la forma de pago arriba 👇</span>`
        : 'Seleccioná un pack y modalidad de pago';

      btnWa.disabled = true;
      btnLemon.disabled = true;
      btnWa.onclick = null;
      btnLemon.onclick = null;
      return;
    }

    label.innerHTML = `Seleccionado: <span>${escapeHtml(selectedCourse)}</span> (<span>${escapeHtml(selectedModalidad)}</span>)`;

    btnWa.disabled = false;
    btnLemon.disabled = false;

    const msg = encodeURIComponent(
      `Hola Hugo! Me interesa el pack "${selectedCourse}" abonando en modalidad de *${selectedModalidad}*. ¿Cómo seguimos?`
    );

    const defaultWaUrl = `https://wa.me/${WA_NUMBER}?text=${msg}`;

    btnWa.onclick = function() {
      if (typeof fbq !== 'undefined') {
        fbq('track', 'Lead', {
          content_name: selectedCourse,
          content_category: selectedModalidad
        });
      }
      window.open(defaultWaUrl, '_blank');
    };

    btnLemon.onclick = async function() {
      const activeCard = document.querySelector('.course-card.selected');
      if (!activeCard) return;

      const nameInput = activeCard.querySelector('.input-nombre');
      const emailInput = activeCard.querySelector('.input-email');
      const countrySelect = activeCard.querySelector('.select-pais');
      const inputOtroPais = activeCard.querySelector('.input-otro-pais');

      const userName = nameInput ? nameInput.value.trim() : '';
      const userEmail = emailInput ? emailInput.value.trim() : '';
      
      let userCountry = countrySelect ? countrySelect.value : '';
      if (userCountry === "Otro" && inputOtroPais && inputOtroPais.value.trim() !== "") {
        userCountry = inputOtroPais.value.trim();
      }

      if (!userName || !userEmail) {
        alert('Por favor, completá tu Nombre y Correo para continuar.');
        if (nameInput && !userName) nameInput.focus();
        else if (emailInput && !userEmail) emailInput.focus();
        return;
      }

      if (countrySelect.value === "Otro" && (!inputOtroPais || inputOtroPais.value.trim() === "")) {
        alert('Por favor, especifica cuál es tu país de residencia.');
        inputOtroPais.focus();
        return;
      }

      btnLemon.disabled = true;
      btnLemon.innerText = 'Registrando...';

      try {
        await fetch(APPSCRIPT_BASE, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'registrar_pago',
            nombre: userName,
            email: userEmail,
            pais: userCountry,
            curso: selectedCourse,
            plan: selectedModalidad
          })
        });
      } catch (err) {
        console.error('Error al registrar en hoja:', err);
      }

      if (typeof fbq !== 'undefined') {
        fbq('track', 'InitiateCheckout', {
          content_name: selectedCourse,
          content_category: selectedModalidad,
          content_type: 'product'
        });
      }

      const detailMsg = encodeURIComponent(
        `Hola Hugo! Ya completé mis datos para registrarme:\n\n📦 Pack: *${selectedCourse}*\n💳 Modalidad: *${selectedModalidad}*\n👤 Nombre: ${userName}\n📧 Email: ${userEmail}\n🌍 País: ${userCountry}\n\n¿Cómo avanzamos con el pago?`
      );

      window.open(`https://wa.me/${WA_NUMBER}?text=${detailMsg}`, '_blank');
      
      btnLemon.disabled = false;
      btnLemon.innerText = '💳 Enviar Datos de Inscripción';
    };
  }


  // ============================================================
  // ESCAPAR HTML
  // ============================================================

  function escapeHtml(value) {
    return String(value || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }


// ============================================================
  // RENDERIZAR PACKS DINÁMICAMENTE CON FORMULARIO INTEGRADO
  // ============================================================

  function renderCourses(courses) {
    const packList = document.getElementById('pack-list');
    if (!packList) return;

    if (!Array.isArray(courses) || courses.length === 0) {
      packList.innerHTML = `<div class="error-message">No hay Packs disponibles por el momento.</div>`;
      return;
    }

    const headers = Object.keys(courses[0]);
    const colB = headers[1];
    const colK = headers.length > 10 ? headers[10] : null;

    const filteredCourses = courses.filter(function(course) {
      const valB = String(course[colB] || '').trim().toLowerCase();
      const valK = colK ? String(course[colK] || '').trim() : '';
      return valB.includes('pack') || valK === 'Packs & Programas Integrales';
    });

    if (filteredCourses.length === 0) {
      packList.innerHTML = `<div class="error-message">No se encontraron Packs disponibles.</div>`;
      return;
    }

    coursesDataGlobal = filteredCourses;
    packList.innerHTML = '';

    filteredCourses.forEach(function(course, index) {
      const nombre = course['Nombre'] || course['Titulo'] || course['title'] || course[colB] || 'Pack';
      const subtitulo = course['detail'] || course['Subtítulo'] || course['Descripcion'] || course['Descripción'] || '';
      const incluye = course['Curso Gratuito'] || course['Que cursos incluye?'] || course['Qué cursos incluye?'] || course['Contenido'] || '';
      const imgUrl = course['imageUrl'] || course['Caratula url'] || course['Carátula url'] || 'https://res.cloudinary.com/dlnrsadbc/image/upload/q_auto,f_auto,w_400/v1778980849/logo_hugo_alvigini_transparente_jodgue_z1tldp.webp';
      const offerNote = course['offerNote'] || course['Nota Oferta'] || '50% off pagando al contado';

      const hasContado = course['buyUrlContado'] || course['Link Contado'] || course[headers[5]] || true;
      const has3 = course['buyUrl3Cuotas'] || course['Link 3 Cuotas'] || course[headers[6]] || true;
      const has6 = course['buyUrl6Cuotas'] || course['Link 6 Cuotas'] || course[headers[7]] || true;

      const card = document.createElement('div');
      card.className = 'course-card';

      card.onclick = function(e) {
        if (e.target.closest('.pay-option-btn') || e.target.closest('.checkout-form-container')) return;
        const firstBtn = card.querySelector('.pay-option-btn');
        if (firstBtn) firstBtn.click();
      };

      let htmlContent = `
        <span class="selected-badge">✓ SELECCIONADO</span>
        <div class="card-content-grid">
          <img src="${escapeHtml(imgUrl)}" alt="${escapeHtml(nombre)}" class="card-img" loading="lazy" onerror="this.src='https://res.cloudinary.com/dlnrsadbc/image/upload/q_auto,f_auto,w_400/v1778980849/logo_hugo_alvigini_transparente_jodgue_z1tldp.webp'">
          <div class="card-info">
            <h3>${escapeHtml(nombre)}</h3>
      `;

      if (subtitulo) {
        htmlContent += `<div class="course-subtitle">${escapeHtml(subtitulo)}</div>`;
      }

      if (incluye) {
        htmlContent += `
          <div class="desc">
            <strong>Incluye / Detalle:</strong> ${escapeHtml(incluye)}
          </div>
        `;
      }

      if (offerNote) {
        htmlContent += `
          <div class="offer-note" style="color:#00E676; font-size:0.85rem; margin-top:6px;">
            ✨ ${escapeHtml(offerNote)}
          </div>
        `;
      }

      htmlContent += `
          </div>
        </div>
        <div class="payment-options-container">
          <div class="payment-options-title">Elegí tu forma de pago:</div>
      `;

      if (hasContado) {
        htmlContent += `
          <button class="pay-option-btn" data-index="${index}" data-modalidad="Pago Contado (50% OFF)">
            <span>💥 Pago Contado</span><strong>Seleccionar</strong>
          </button>
        `;
      }
      if (has3) {
        htmlContent += `
          <button class="pay-option-btn" data-index="${index}" data-modalidad="3 Cuotas">
            <span>📅 En 3 Cuotas</span><strong>Seleccionar</strong>
          </button>
        `;
      }
      if (has6) {
        htmlContent += `
          <button class="pay-option-btn" data-index="${index}" data-modalidad="6 Cuotas">
            <span>📅 En 6 Cuotas</span><strong>Seleccionar</strong>
          </button>
        `;
      }

      htmlContent += `
          <div class="checkout-form-container">
            <div class="payment-options-title" style="margin-bottom:14px; color:#00e5ff;">📝 Completá tus datos para registrar el pago:</div>
            <div class="form-group">
              <label>Nombre y Apellido</label>
              <input type="text" class="input-nombre" placeholder="Tu nombre completo">
            </div>
            <div class="form-group">
              <label>Correo Electrónico (Gmail preferentemente)</label>
              <input type="email" class="input-email" placeholder="tucorreo@gmail.com">
            </div>
            <div class="form-group">
              <label>País de residencia</label>
              <select class="select-pais" onchange="verificarPaisDinamico(this)">
                <option value="Paraguay">Paraguay</option>
                <option value="Uruguay">Uruguay</option>
                <option value="Chile">Chile</option>
                <option value="México">México</option>
                <option value="Colombia">Colombia</option>
                <option value="Puerto Rico">Puerto Rico</option>
                <option value="España">España</option>
                <option value="Argentina">Argentina</option>
                <option value="Otro">Otro</option>
              </select>
            </div>
            <!-- Campo condicional para cada tarjeta -->
            <div class="form-group grupo-otro-pais" style="display: none; margin-top: 10px;">
              <label>Indica tu país</label>
              <input type="text" class="input-otro-pais" placeholder="Escribe tu país aquí">
            </div>
          </div>
        </div>
      `;

      card.innerHTML = htmlContent;

      card.querySelectorAll('.pay-option-btn').forEach(function(button) {
        button.addEventListener('click', function(event) {
          event.stopPropagation();
          const idx = Number(this.dataset.index);
          const modalidad = this.dataset.modalidad;
          selectModalidad(idx, modalidad, event);
        });
      });

      packList.appendChild(card);
    });

    // SELECCIONAR AUTOMÁTICAMENTE EL PRIMER PACK Y SU PRIMERA MODALIDAD PARA QUE EL BOTÓN SE ENCIENDA DE ENTRADA
    if (filteredCourses.length > 0) {
      const firstCard = packList.querySelector('.course-card');
      const firstPayBtn = firstCard ? firstCard.querySelector('.pay-option-btn') : null;
      if (firstPayBtn) {
        selectModalidad(0, firstPayBtn.dataset.modalidad, null);
      }
    }
  }


  // ============================================================
  // CARGAR DATOS DESDE APPS SCRIPT
  // ============================================================

  async function loadCourses() {
    const packList = document.getElementById('pack-list');
    if (!packList) return;

    try {
      packList.innerHTML = `<div class="skeleton-card" style="padding:20px; background:rgba(16,16,38,0.7); border-radius:12px; min-height:150px;">Cargando packs...</div>`;

      const response = await fetch(APPSCRIPT_BASE, {
        method: 'GET',
        redirect: 'follow',
        cache: 'no-store'
      });

      if (!response.ok) {
        throw new Error(`Apps Script respondió con HTTP ${response.status}`);
      }

      const text = await response.text();
      let data = JSON.parse(text);

      if (data && data.error) {
        throw new Error(data.error);
      }

      let packsArray = [];
      if (Array.isArray(data)) {
        packsArray = data;
      } else if (data.categories && Array.isArray(data.categories)) {
        const packCategory = data.categories.find(cat => cat.name === "Packs & Programas Integrales");
        if (packCategory && packCategory.products) {
          packsArray = packCategory.products;
        }
      }

      renderCourses(packsArray);

    } catch (err) {
      console.error('Error al cargar datos:', err);
      packList.innerHTML = `
        <div class="error-message">
          <strong>No se pudieron cargar los Packs.</strong>
          <br><br>
          ${escapeHtml(err.message)}
        </div>`;
    }
  }


  // ============================================================
  // INICIAR
  // ============================================================

  document.addEventListener('DOMContentLoaded', function() {
    loadCourses();
  });

  // Función para mostrar u ocultar el input de "Otro" en la tarjeta activa
  function verificarPaisDinamico(selectElement) {
    const formContainer = selectElement.closest('.checkout-form-container');
    if (!formContainer) return;
    
    const grupoOtro = formContainer.querySelector('.grupo-otro-pais');
    const inputOtro = formContainer.querySelector('.input-otro-pais');

    if (!grupoOtro || !inputOtro) return;

    if (selectElement.value === "Otro") {
      grupoOtro.style.display = "block";
      inputOtro.focus();
    } else {
      grupoOtro.style.display = "none";
      inputOtro.value = "";
    }
  }
</script>
