  <script>
    const FACEBOOK_PIXEL_ID = '2189151328193841';
    let pixelCargado = false;
    let tiempoPermitido = false;

    setTimeout(() => { tiempoPermitido = true; }, 2000);

    function cargarPixelFacebook() {
      if (pixelCargado || !tiempoPermitido) return;
      pixelCargado = true;
      window.removeEventListener('scroll', controlarInteraccion);
      window.removeEventListener('mousemove', controlarInteraccion);
      window.removeEventListener('touchstart', controlarInteraccion);

      !function(f,b,e,v,n,t,s)
      {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};
      if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
      n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t,s)}(window,document,'script',
      'https://connect.facebook.net/en_US/fbevents.js');

      fbq('init', FACEBOOK_PIXEL_ID);
      fbq('track', 'PageView');
    }

    function controlarInteraccion() {
      if (tiempoPermitido) { cargarPixelFacebook(); }
    }

    window.addEventListener('scroll', controlarInteraccion, { passive: true });
    window.addEventListener('mousemove', controlarInteraccion, { passive: true });
    window.addEventListener('touchstart', controlarInteraccion, { passive: true });
    setTimeout(cargarPixelFacebook, 4000);
  </script>

  <style>
    :root {
      --primary-blue: #00e5ff;
      --action-green: #4CAF50;
      --innovation-purple: #101026;
      --dark-background: #070714;
      --text-light: #ffffff;

      --border-radius: 12px;
    }
    
    body {
      font-family: "Open Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;

      overflow-x: hidden;
      min-height: 100vh;
      display: flex;

      background-image: radial-gradient(circle at 50% 0%, #131336 0%, var(--dark-background) 70%);

    h1, h2, h3 {

    }

    header.hero-main {
      padding: 30px 20px 25px 20px;
      background: linear-gradient(180deg, rgba(16, 16, 38, 0.95) 0%, rgba(7, 7, 20, 0.8) 100%);
      text-align: center;
      border-bottom: 1px solid rgba(0, 229, 255, 0.2);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      position: relative;
    }

    .hero-content-wrapper {
      max-width: 900px;

    }

    .top-nav-row {

    .btn-volver {
      display: inline-flex;

      gap: 8px;
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-light);
      border: 1px solid rgba(0, 229, 255, 0.3);
      padding: 8px 16px;
      border-radius: 8px;
      font-family: "Montserrat", sans-serif;
      font-size: 0.9rem;

    }

    .btn-volver:hover {
      background: rgba(0, 229, 255, 0.1);

      box-shadow: 0 0 15px rgba(0, 229, 255, 0.2);
    }

    .logo-hero {
      width: 200px; 
      max-width: 70%; 
      height: auto; 
      display: block;
      filter: drop-shadow(0 0 20px rgba(0, 229, 255, 0.4)); 
    }

    .hero-main h1 {
      font-size: clamp(1.6rem, 3.5vw, 2.4rem);
      font-weight: 700;
      margin: 0;
      color: var(--text-light);
      text-transform: uppercase;
      letter-spacing: 0.05em;

    }

    .hero-main p {

    }

    #courses-container {
      width: 100%;
      box-sizing: border-box;
      padding: 30px 20px;
      max-width: 900px;
      margin: 0 auto;
      flex: 1;
    }

    .section-header h2 {
      font-family: "Montserrat", sans-serif;
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--primary-blue);
      text-transform: uppercase;

    .course-card {
      background: rgba(16, 16, 38, 0.7);

    .course-card:hover {

    }

    .course-card.selected {
      border-color: #00e5ff;
      box-shadow: 0 0 0 2px rgba(0,229,255,0.3), 0 8px 30px rgba(0,229,255,0.2);

    .selected-badge {

    .card-content-grid {
      display: flex;
      gap: 20px;
      align-items: flex-start;
    }

    .card-img {
      width: 130px;
      height: 130px;
      object-fit: contain;
      border-radius: 8px;

    .card-info {

    }

    .course-card h3 {
      font-family: "Montserrat", sans-serif;

      margin-top: 0;

    .course-subtitle {

      margin-bottom: 6px;
      line-height: 1.4;
    }

    .benefits-list li::before {
      content: "✔";
      position: absolute;
      left: 0;
      color: #00e5ff;

    }

    .payment-options-container {
      display: none;

      padding-top: 16px;

      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .payment-options-title {
      font-size: 0.85rem;
      color: #00e5ff;
      font-weight: 600;

      font-family: "Montserrat", sans-serif;

      letter-spacing: 0.05em;
    }

    .pay-option-btn {
      width: 100%;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #fff;
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s;
    }

    .pay-option-btn:hover {
      background: rgba(0, 229, 255, 0.08);
      border-color: rgba(0, 229, 255, 0.5);
    }

    .pay-option-btn.active {
      background: rgba(0, 229, 255, 0.15);
      border-color: #00e5ff;
      font-weight: bold;
      color: #00e5ff;
      box-shadow: 0 0 10px rgba(0, 229, 255, 0.2);
    }

    .sticky-bar {
      position: fixed;
      bottom: 0; left: 0; width: 100%;
      z-index: 100;
      padding: 14px 20px;
      background: rgba(7, 7, 20, 0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid rgba(0, 229, 255, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      box-sizing: border-box;
      box-shadow: 0 -5px 25px rgba(0,0,0,0.8);
    }

    .sticky-bar .selected-label {
      font-size: 0.85rem;
      color: var(--text-dark);
      width: 100%;
      text-align: center;
      margin-bottom: 2px;
    }

    .sticky-bar .selected-label span {
      color: #00e5ff;
      font-weight: 600;
    }

    .action-btn-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      width: 100%;
      max-width: 600px;
    }

    .btn-action {
      flex: 1;
      min-width: 220px;
      padding: 12px 20px;
      border: none;
      border-radius: var(--border-radius);
      font-family: "Montserrat", sans-serif;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      white-space: nowrap;
    }

    .btn-whatsapp {
      background: linear-gradient(135deg, #25D366, #128C7E);
      color: var(--text-light);
      box-shadow: 0 4px 15px rgba(37,211,102,0.3);
    }
    .btn-whatsapp:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(37,211,102,0.4); }

    .btn-lemon {
      background: linear-gradient(135deg, #00E676, #00A859);
      color: #0a1e10;
      box-shadow: 0 4px 15px rgba(0,230,118,0.3);
    }
    .btn-lemon:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,230,118,0.4); }

    .btn-action:disabled {
      background: linear-gradient(135deg, #222, #151515);
      color: #666;
      box-shadow: none;
      cursor: not-allowed;
      opacity: 0.5;
    }

    .error-message { text-align: center; padding: 40px; color: #ff6b6b; }

    footer {
      margin-top: auto;
      padding: 30px 0 140px 0;
      text-align: center;
    }

    .banner-pagos {
      width: 100% !important;
      max-width: 350px !important;
      height: auto !important;
      display: block;
      margin: 0 auto; 
    }

    footer > p {
      margin-top: 15px;
      font-size: 0.82rem;
      color: var(--text-dark);
    }

    @media (max-width: 768px) {
      .card-content-grid { flex-direction: column; align-items: center; text-align: center; }
      .card-img { width: 120px; height: 120px; margin-bottom: 10px; }
      .benefits-list li { padding-left: 0; list-style-position: inside; }
      .action-btn-group { flex-direction: column; }
      .btn-action { width: 100%; }
      footer { padding-bottom: 150px; }
    }
  </style>
</head>
<body>


  

  
  <header class="hero-main">
    <div class="hero-content-wrapper">
      <div class="top-nav-row">
        <a href="https://hugo85ar.github.io/catalogo-promociones/" class="btn-volver" class="btn-volver">
          ← Volver al Inicio
        </a>
      </div>
      <img src="https://res.cloudinary.com/dlnrsadbc/image/upload/q_auto,f_auto,w_400/v1778980849/logo_hugo_alvigini_transparente_jodgue_z1tldp.webp"
           alt="Hugo Alvigini" class="logo-hero" fetchpriority="high" width="400" height="100">
      <h1>Packs & Programas Integrales</h1>
      <p>Sistemas para escalar tu negocio digital al siguiente nivel</p>
    </div>
  </header>

  <main id="courses-container">
    <div class="section-header"><h2>Elegí tu Pack de Cursos</h2></div>
    <div id="pack-list">
      <div class="skeleton-card" style="padding:20px; background:rgba(16,16,38,0.7); border-radius:12px; min-height:150px;"></div>
    </div>
  </main>

  <footer>
    <div class="payment-info">
      <img src="https://res.cloudinary.com/dlnrsadbc/image/upload/q_auto,f_auto,w_350/v1778980376/pago_moneda_local_ms2q3z.webp" 
           alt="Pagar en Moneda Local Argentina y Paraguay" 
           class="banner-pagos" loading="lazy" width="350" height="70">
    </div>
    <p>&copy; 2026 Hugo Alvigini. Todos los derechos reservados.</p>
  </footer>

  <div class="sticky-bar">
    <div class="selected-label" id="selected-label">Seleccioná un pack y modalidad de pago</div>
    <div class="action-btn-group">
      <button class="btn-action btn-whatsapp" id="btn-whatsapp" disabled>
        📲 Consultar por WhatsApp
      </button>
      <button class="btn-action btn-lemon" id="btn-lemon" disabled>
        💳 Pagar con Lemon
      </button>
    </div>
  </div>

 <script>
    const APPSCRIPT_BASE = 'https://script.google.com/macros/s/AKfycbyxlO60asW5Jc8tHtjtSqk8-tUTSxJwwDZ-i0oN-Jgqn5wsmg7l0a70jFD7rZssUD4IOw/exec';
    const WA_NUMBER = '5491176529179';

    let selectedCourse = null;
    let selectedModalidad = null;
    let selectedLinkContado = '';
    let selectedLink3Cuotas = '';
    let selectedLink6Cuotas = '';

    function formatPrice(val) {
      if (!val || val === '-') return '-';
      const num = parseFloat(val);
      if (isNaN(num)) return val;
      return num.toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function selectCourse(nombre) {
      if (selectedCourse === nombre) {
        selectedCourse = null;
        selectedModalidad = null;
        selectedLinkContado = '';
        selectedLink3Cuotas = '';
        selectedLink6Cuotas = '';
        document.querySelectorAll('.course-card').forEach(c => {
          c.classList.remove('selected');
          c.querySelectorAll('.pay-option-btn').forEach(b => b.classList.remove('active'));
        });
        updateStickyBar();
        return;
      }

      selectedCourse = nombre;
      selectedModalidad = null;
      selectedLinkContado = '';
      selectedLink3Cuotas = '';
      selectedLink6Cuotas = '';

      document.querySelectorAll('.course-card').forEach(c => {
        c.classList.remove('selected');
        c.querySelectorAll('.pay-option-btn').forEach(b => b.classList.remove('active'));
        if (c.dataset.nombre === nombre) {
          c.classList.add('selected');
        }
      });

      updateStickyBar();
    }

    function selectModalidad(nombre, modalidad, linkContado, link3, link6, event) {
      event.stopPropagation();
      
      selectedCourse = nombre;
      selectedModalidad = modalidad;
      selectedLinkContado = linkContado || '';
      selectedLink3Cuotas = link3 || '';
      selectedLink6Cuotas = link6 || '';

      document.querySelectorAll('.course-card').forEach(c => {
        if (c.dataset.nombre === nombre) {
          c.classList.add('selected');
          c.querySelectorAll('.pay-option-btn').forEach(btn => {
            btn.classList.remove('active');
          });
        } else {
          c.classList.remove('selected');
        }
      });

      event.currentTarget.classList.add('active');
      updateStickyBar();
    }

    function updateStickyBar() {
      const label = document.getElementById('selected-label');
      const btnWa  = document.getElementById('btn-whatsapp');
      const btnLemon = document.getElementById('btn-lemon');

      if (!selectedCourse || !selectedModalidad) {
        label.innerHTML = selectedCourse 
          ? `Pack: <span>${selectedCourse}</span> — <span style="color:#00e5ff">Elegí la forma de pago arriba 👇</span>`
          : 'Seleccioná un pack y modalidad de pago';
        
        btnWa.disabled = true;
        btnLemon.disabled = true;
        btnWa.onclick = null;
        btnLemon.onclick = null;
        return;
      }

      label.innerHTML = `Seleccionado: <span>${selectedCourse}</span> (<span>${selectedModalidad}</span>)`;
      btnWa.disabled = false;
      btnLemon.disabled = false;

      // Configurar WhatsApp (para consultas generales o respaldo)
      const msg = encodeURIComponent(
        `Hola Hugo! Me interesa el pack "${selectedCourse}" abonando en modalidad de *${selectedModalidad}*. ¿Cómo seguimos?`
      );
      const waUrl = `https://wa.me/${WA_NUMBER}?text=${msg}`;

      btnWa.onclick = () => {
        if (typeof fbq !== 'undefined') fbq('track', 'Lead');
        window.open(waUrl, '_blank');
      };

      // Configurar Botón de Pago (según la modalidad elegida y los links de las columnas L, M, N)
      if (selectedModalidad.includes('Pago Contado')) {
        btnLemon.onclick = () => {
          if (typeof fbq !== 'undefined') fbq('track', 'InitiateCheckout');
          if (selectedLinkContado.trim() !== '') {
            window.open(selectedLinkContado.trim(), '_blank');
          } else {
            window.open(waUrl, '_blank');
          }
        };
      } else if (selectedModalidad.includes('3 Cuotas')) {
        btnLemon.onclick = () => {
          if (typeof fbq !== 'undefined') fbq('track', 'InitiateCheckout');
          if (selectedLink3Cuotas.trim() !== '') {
            window.open(selectedLink3Cuotas.trim(), '_blank');
          } else {
            window.open(waUrl, '_blank');
          }
        };
      } else if (selectedModalidad.includes('6 Cuotas')) {
        btnLemon.onclick = () => {
          if (typeof fbq !== 'undefined') fbq('track', 'InitiateCheckout');
          if (selectedLink6Cuotas.trim() !== '') {
            window.open(selectedLink6Cuotas.trim(), '_blank');
          } else {
            window.open(waUrl, '_blank');
          }
        };
      }
    }

    function handleCourses(courses) {
      const container = document.getElementById('courses-container');
      if (!courses || courses.error) {
        container.innerHTML = `<div class="error-message">Error al cargar los packs.</div>`;
        return;
      }
      renderCourses(courses);
    }

    function renderCourses(courses) {
      const packList = document.getElementById('pack-list');
      const container = document.getElementById('courses-container');

      if (!Array.isArray(courses) || courses.length === 0) {
        container.innerHTML = `<div class="error-message">No hay packs disponibles por el momento.</div>`;
        return;
      }

      packList.innerHTML = '';

      const packsFiltrados = courses.filter(course => {
        const esPack = course['Pack'] && course['Pack'].toString().toLowerCase().includes('pack');
        return esPack;
      });

      const itemsARenderizar = packsFiltrados.length > 0 ? packsFiltrados : courses;

      itemsARenderizar.forEach(course => {
        const nombre   = course['PackProducto / Pack'] || course['Producto / Pack'] || '';
        const contado  = formatPrice(course['Precio Total (50% por pago unico)']);
        const cuota3   = formatPrice(course['Opción 3 Cuotas (Mensual)']);
        const cuota6   = formatPrice(course['Opción 6 Cuotas (Mensual)']);
        
        const incluye  = course['Que cursos incluye?'] || '';
        const subtitulo = course['Subtítulo'] || '';
        const beneficiosCrudos = course['Beneficios Principales'] || '';
        
        const rawImg   = course['Caratula url'] || course['Imagen'] || '';
        const imgUrl   = (rawImg.trim() !== '') 
                         ? rawImg.trim() 
                         : 'https://res.cloudinary.com/dlnrsadbc/image/upload/q_auto,f_auto,w_400/v1778980849/logo_hugo_alvigini_transparente_jodgue_z1tldp.webp';
        
        // Mapeo de columnas L, M, N
        const linkContado = course['Link de Pago Contado'] || '';
        const link3       = course['Link de Pago en 3 Cuotas'] || '';
        const link6       = course['Link de Pago en 6 Cuotas'] || '';

        let beneficiosHTML = '';
        if (beneficiosCrudos) {
          const listaBeneficios = beneficiosCrudos.split('\n').filter(b => b.trim() !== '');
          if (listaBeneficios.length > 0) {
            beneficiosHTML = '<ul class="benefits-list">' + 
              listaBeneficios.map(b => `<li>${b.trim()}</li>`).join('') + 
              '</ul>';
          }
        }

        const safeClass = 'card-' + nombre.replace(/[^a-zA-Z0-9]/g, '_');

        const card = document.createElement('div');
        card.className = `course-card ${safeClass}`;
        card.dataset.nombre = nombre;
        card.onclick = () => selectCourse(nombre);

        const escapedName = nombre.replace(/'/g, "\\'");
        const escapedLinkContado = linkContado.replace(/'/g, "\\'");
        const escapedLink3 = link3.replace(/'/g, "\\'");
        const escapedLink6 = link6.replace(/'/g, "\\'");

        card.innerHTML = `
          <span class="selected-badge">✓ SELECCIONADO</span>
          <div class="card-content-grid">
            <img src="${imgUrl}" alt="${nombre}" class="card-img" loading="lazy">
            <div class="card-info">
              <h3>${nombre}</h3>
              ${subtitulo ? `<div class="course-subtitle">${subtitulo}</div>` : ''}
              ${incluye ? `<div class="desc"><strong>Incluye:</strong> ${incluye}</div>` : ''}
              ${beneficiosHTML}
            </div>
          </div>
          
          <div class="payment-options-container">
            <div class="payment-options-title">Elegí tu forma de pago:</div>
            
            <button class="pay-option-btn" onclick="selectModalidad('${escapedName}', 'Pago Contado (50% OFF)', '${escapedLinkContado}', '${escapedLink3}', '${escapedLink6}', event)">
              <span>💥 Pago Contado</span>
              <strong>$${contado}</strong>
            </button>
            
            <button class="pay-option-btn" onclick="selectModalidad('${escapedName}', '3 Cuotas', '${escapedLinkContado}', '${escapedLink3}', '${escapedLink6}', event)">
              <span>📅 En 3 Cuotas</span>
              <strong>$${cuota3}</strong>
            </button>
            
            <button class="pay-option-btn" onclick="selectModalidad('${escapedName}', '6 Cuotas', '${escapedLinkContado}', '${escapedLink3}', '${escapedLink6}', event)">
              <span>📅 En 6 Cuotas</span>
              <strong>$${cuota6}</strong>
            </button>
          </div>
        `;

        packList.appendChild(card);
      });

      container.style.opacity = '0';
      setTimeout(() => {
        container.style.transition = 'opacity 0.25s ease-in-out';
        container.style.opacity = '1';
      }, 50);
    }

    function loadCourses() {
      const script = document.createElement('script');
      script.src = APPSCRIPT_BASE + '?callback=handleCourses';
      script.defer = true; 
      script.onerror = () => {
        document.getElementById('courses-container').innerHTML =
          '<div class="error-message">No se pudieron cargar los datos. Por favor recargá la página.</div>';
      };
      document.body.appendChild(script);
    }

    loadCourses();
</script>
</body>
</html>
