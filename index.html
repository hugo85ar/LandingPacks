  <script>
    const FACEBOOK_PIXEL_ID = '2189151328193841';
    let pixelCargado = false;
    let tiempoPermitido = false;

    setTimeout(() => { tiempoPermitido = true; }, 2000);

    function cargarPixelFacebook() {
      if (pixelCargado || !tiempoPermitido) return;
      pixelCargado = true;
      window.removeEventListener('scroll', controlarInteraccion);
      window.removeEventListener('mousemove', controlarInteraccion);
      window.removeEventListener('touchstart', controlarInteraccion);

      !function(f,b,e,v,n,t,s)
      {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};
      if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
      n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t,s)}(window,document,'script',
      'https://connect.facebook.net/en_US/fbevents.js');

      fbq('init', FACEBOOK_PIXEL_ID);
      fbq('track', 'PageView');
    }

    function controlarInteraccion() {
      if (tiempoPermitido) { cargarPixelFacebook(); }
    }

    window.addEventListener('scroll', controlarInteraccion, { passive: true });
    window.addEventListener('mousemove', controlarInteraccion, { passive: true });
    window.addEventListener('touchstart', controlarInteraccion, { passive: true });
    setTimeout(cargarPixelFacebook, 4000);
  </script>
  <noscript>
    <img height="1" width="1" style="display:none" src="https://www.facebook.com/tr?id=2189151328193841&ev=PageView&noscript=1"/>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary-blue: #5974ff;
      --action-green: #4CAF50;
      --innovation-purple: #5726B8;
      --dark-background: #0b0b1e;
      --text-light: #ffffff;
      --text-dark: #cccccc;
      --border-radius: 12px;
    }
    
    body {
      font-family: "Open Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      background-color: var(--dark-background);
      color: #ffffff;
      line-height: 1.6;
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    h1, h2, h3 {
      font-family: "Montserrat", sans-serif;
      font-display: swap;
    }

    .top-bar-container {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 25px 20px 10px 20px;
      box-sizing: border-box;
    }

    .btn-volver {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: transparent;
      color: var(--text-light);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 8px 16px;
      border-radius: 8px;
      font-family: "Montserrat", sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-bottom: 20px;
    }

    .btn-volver:hover {
      background: rgba(255, 255, 255, 0.05);
      border-color: var(--primary-blue);
      color: var(--primary-blue);
    }

    .section-title-area h1 {
      font-size: clamp(1.8rem, 4vw, 2.4rem);
      font-weight: 700;
      margin: 0 0 8px 0;
      color: var(--text-light);
    }

    .section-title-area p {
      color: var(--text-dark);
      font-size: 1rem;
      margin: 0;
    }

    .logo-container-central { 
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      padding: 10px 0;
      margin: 0 auto;
    }

    .logo-hero {
      width: 380px; 
      max-width: 85%; 
      height: auto; 
      display: block;
      filter: drop-shadow(0 0 25px rgba(0, 229, 255, 0.4)); 
    }
    
    header.hero-main {
      padding: 25px 0 20px 0;
      background: linear-gradient(135deg, var(--primary-blue), var(--innovation-purple));
      text-align: center;
      border-bottom-left-radius: var(--border-radius);
      border-bottom-right-radius: var(--border-radius);
      margin-bottom: 10px;
    }

    #courses-container {
      width: 100%;
      box-sizing: border-box;
      padding: 20px;
      max-width: 900px;
      margin: 0 auto;
      flex: 1;
    }

    .section-header h2 {
      font-family: "Montserrat", sans-serif;
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--primary-blue);
      border-bottom: 1px solid rgba(89,116,255,0.3);
      padding-bottom: 8px;
      margin-bottom: 20px;
    }

    .course-card {
      background: rgba(26, 26, 58, 0.8);
      border: 2px solid rgba(89, 116, 255, 0.2);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
      box-sizing: border-box;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
    }

    .course-card:hover {
      border-color: rgba(89,116,255,0.5);
      box-shadow: 0 8px 24px rgba(89,116,255,0.15);
    }

    .course-card.selected {
      border-color: #7fffb0;
      box-shadow: 0 0 0 3px rgba(127,255,176,0.2), 0 8px 28px rgba(127,255,176,0.15);
      background: rgba(26, 50, 38, 0.85);
    }

    .selected-badge {
      display: none;
      position: absolute;
      top: 16px;
      right: 16px;
      background: #7fffb0;
      color: #0a1e10;
      font-size: 0.75rem;
      font-weight: 700;
      font-family: "Montserrat", sans-serif;
      padding: 4px 10px;
      border-radius: 20px;
      letter-spacing: 0.05em;
    }

    .course-card.selected .selected-badge { display: inline-block; }

    .card-content-grid {
      display: flex;
      gap: 20px;
      align-items: flex-start;
    }

    .card-img {
      width: 130px;
      height: 130px;
      object-fit: contain;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.1);
      flex-shrink: 0;
      background: #151530;
      padding: 4px;
    }

    .card-info {
      flex: 1;
    }

    .course-card h3 {
      font-family: "Montserrat", sans-serif;
      color: #a4b3ff;
      margin-top: 0;
      margin-bottom: 4px;
      font-size: 1.15rem;
    }

    .course-card.selected h3 { color: #7fffb0; }

    .course-subtitle {
      font-size: 0.92rem;
      color: #e2e8f0;
      font-weight: 600;
      margin-bottom: 8px;
      line-height: 1.4;
    }

    .course-card .desc {
      font-size: 0.85rem;
      color: var(--text-dark);
      margin-bottom: 12px;
      line-height: 1.4;
    }

    .benefits-list {
      list-style: none;
      padding: 0;
      margin: 10px 0 0 0;
      font-size: 0.84rem;
      color: var(--text-light);
    }

    .benefits-list li {
      position: relative;
      padding-left: 18px;
      margin-bottom: 6px;
      line-height: 1.4;
    }

    .benefits-list li::before {
      content: "✔";
      position: absolute;
      left: 0;
      color: #7fffb0;
      font-size: 0.8rem;
    }

    .payment-options-container {
      display: none;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid rgba(255,255,255,0.15);
      animation: fadeIn 0.3s ease;
    }

    .course-card.selected .payment-options-container {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .payment-options-title {
      font-size: 0.85rem;
      color: #7fffb0;
      font-weight: 600;
      margin-bottom: 10px;
      font-family: "Montserrat", sans-serif;
    }

    .pay-option-btn {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      font-size: 0.88rem;
      transition: all 0.2s;
    }

    .pay-option-btn:hover {
      background: rgba(127, 255, 176, 0.1);
      border-color: #7fffb0;
    }

    .pay-option-btn.active {
      background: rgba(127, 255, 176, 0.2);
      border-color: #7fffb0;
      font-weight: bold;
      color: #7fffb0;
    }

    .sticky-bar {
      position: fixed;
      bottom: 0; left: 0; width: 100%;
      z-index: 100;
      padding: 14px 20px;
      background: rgba(11, 11, 30, 0.96);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid rgba(89,116,255,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      box-sizing: border-box;
    }

    .sticky-bar .selected-label {
      font-size: 0.85rem;
      color: var(--text-dark);
      width: 100%;
      text-align: center;
      margin-bottom: 2px;
    }

    .sticky-bar .selected-label span {
      color: #7fffb0;
      font-weight: 600;
    }

    .action-btn-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      width: 100%;
      max-width: 600px;
    }

    .btn-action {
      flex: 1;
      min-width: 220px;
      padding: 12px 20px;
      border: none;
      border-radius: var(--border-radius);
      font-family: "Montserrat", sans-serif;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      white-space: nowrap;
    }

    .btn-whatsapp {
      background: linear-gradient(135deg, #25D366, #128C7E);
      color: var(--text-light);
      box-shadow: 0 4px 15px rgba(37,211,102,0.3);
    }
    .btn-whatsapp:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(37,211,102,0.4); }

    .btn-lemon {
      background: linear-gradient(135deg, #00E676, #00A859);
      color: #0a1e10;
      box-shadow: 0 4px 15px rgba(0,230,118,0.3);
    }
    .btn-lemon:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,230,118,0.4); }

    .btn-action:disabled {
      background: linear-gradient(135deg, #3a3a3a, #222);
      color: #777;
      box-shadow: none;
      cursor: not-allowed;
      opacity: 0.6;
    }

    .error-message { text-align: center; padding: 40px; color: #ff6b6b; }

    footer {
      margin-top: auto;
      padding: 30px 0 110px 0;
      text-align: center;
    }

    .banner-pagos {
      width: 100% !important;
      max-width: 350px !important;
      height: auto !important;
      display: block;
      margin: 0 auto; 
    }

    footer > p {
      margin-top: 15px;
      font-size: 0.82rem;
      color: var(--text-dark);
    }

    @media (max-width: 768px) {
      .card-content-grid { flex-direction: column; align-items: center; text-align: center; }
      .card-img { width: 120px; height: 120px; margin-bottom: 10px; }
      .benefits-list li { padding-left: 0; list-style-position: inside; }
      .action-btn-group { flex-direction: column; }
      .btn-action { width: 100%; }
      footer { padding-bottom: 140px; }
    }
  </style>
</head>
<body>

  <header class="hero-main">
    <div class="logo-container-central">
      <img src="https://res.cloudinary.com/dlnrsadbc/image/upload/q_auto,f_auto,w_400/v1778980849/logo_hugo_alvigini_transparente_jodgue_z1tldp.webp"
           alt="HA - Hugo Alvigini" class="logo-hero" fetchpriority="high" width="400" height="100">
    </div>
  </header>

  <div class="top-bar-container">
    <a href="../catalogo-promociones/" class="btn-volver">
      ← Volver
    </a>
    <div class="section-title-area">
      <h1>Packs & Programas Integrales</h1>
      <p>Seleccioná tu pack, mirá los beneficios y elegí la forma de pago.</p>
    </div>
  </div>

  <main id="courses-container">
    <div class="section-header"><h2>Programas y Packs Destacados</h2></div>
    <div id="pack-list">
      <div class="skeleton-card" style="padding:20px; background:rgba(26,26,58,0.8); border-radius:12px; min-height:150px;"></div>
    </div>
  </main>

  <footer>
    <div class="payment-info">
      <img src="https://res.cloudinary.com/dlnrsadbc/image/upload/q_auto,f_auto,w_350/v1778980376/pago_moneda_local_ms2q3z.webp" 
           alt="Pagar en Moneda Local Argentina y Paraguay" 
           class="banner-pagos" loading="lazy" width="350" height="70">
    </div>
    <p>&copy; 2026 Huguito Bot. Todos los derechos reservados.</p>
  </footer>

  <div class="sticky-bar">
    <div class="selected-label" id="selected-label">Seleccioná un pack y modalidad de pago</div>
    <div class="action-btn-group">
      <button class="btn-action btn-whatsapp" id="btn-whatsapp" disabled>
        📲 Consultar por WhatsApp
      </button>
      <button class="btn-action btn-lemon" id="btn-lemon" disabled>
        💳 Pagar con Lemon
      </button>
    </div>
  </div>

 <script>
    const APPSCRIPT_BASE = 'https://script.google.com/macros/s/AKfycbyxlO60asW5Jc8tHtjtSqk8-tUTSxJwwDZ-i0oN-Jgqn5wsmg7l0a70jFD7rZssUD4IOw/exec';
    const WA_NUMBER = '5491176529179';

    let selectedCourse = null;
    let selectedModalidad = null;

    function formatPrice(val) {
      if (!val || val === '-') return '-';
      const num = parseFloat(val);
      if (isNaN(num)) return val;
      return num.toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function selectCourse(nombre) {
      document.querySelectorAll('.course-card').forEach(c => c.classList.remove('selected'));

      if (selectedCourse === nombre) {
        selectedCourse = null;
        selectedModalidad = null;
        updateStickyBar();
        return;
      }

      selectedCourse = nombre;
      selectedModalidad = null;

      document.querySelectorAll('.course-card').forEach(c => {
        if (c.dataset.nombre === nombre) c.classList.add('selected');
      });

      updateStickyBar();
    }

    function selectModalidad(nombre, modalidad, event) {
      event.stopPropagation();
      selectedCourse = nombre;
      selectedModalidad = modalidad;

      document.querySelectorAll(`.card-${CSS.escape(nombre)} .pay-option-btn`).forEach(btn => {
        btn.classList.remove('active');
      });
      event.currentTarget.classList.add('active');

      updateStickyBar();
    }

    function updateStickyBar() {
      const label = document.getElementById('selected-label');
      const btnWa  = document.getElementById('btn-whatsapp');
      const btnLemon = document.getElementById('btn-lemon');

      if (!selectedCourse || !selectedModalidad) {
        label.innerHTML = selectedCourse 
          ? `Pack: <span>${selectedCourse}</span> — <span style="color:#ffcc00">Elegí la forma de pago arriba 👇</span>`
          : 'Seleccioná un pack y modalidad de pago';
        
        btnWa.disabled = true;
        btnLemon.disabled = true;
        btnWa.onclick = null;
        btnLemon.onclick = null;
        return;
      }

      label.innerHTML = `Seleccionado: <span>${selectedCourse}</span> (<span>${selectedModalidad}</span>)`;
      btnWa.disabled = false;
      btnLemon.disabled = false;

      const msg = encodeURIComponent(
        `Hola Hugo! Me interesa el pack "${selectedCourse}" abonando en modalidad de *${selectedModalidad}*. ¿Cómo seguimos?`
      );
      const waUrl = `https://wa.me/${WA_NUMBER}?text=${msg}`;

      btnWa.onclick = () => {
        if (typeof fbq !== 'undefined') fbq('track', 'Lead');
        window.open(waUrl, '_blank');
      };

      btnLemon.onclick = () => {
        if (typeof fbq !== 'undefined') fbq('track', 'InitiateCheckout');
        let lemonLink = "https://pay.lemon.me/tu-link-general"; 
        window.open(lemonLink, '_blank');
      };
    }

    function handleCourses(courses) {
      const container = document.getElementById('courses-container');
      if (!courses || courses.error) {
        container.innerHTML = `<div class="error-message">Error al cargar los packs.</div>`;
        return;
      }
      renderCourses(courses);
    }

    function renderCourses(courses) {
      const packList = document.getElementById('pack-list');
      const container = document.getElementById('courses-container');

      if (!Array.isArray(courses) || courses.length === 0) {
        container.innerHTML = `<div class="error-message">No hay packs disponibles por el momento.</div>`;
        return;
      }

      packList.innerHTML = '';

      const packsFiltrados = courses.filter(course => {
        const esPack = course['Pack'] && course['Pack'].toString().toLowerCase().includes('pack');
        return esPack;
      });

      const itemsARenderizar = packsFiltrados.length > 0 ? packsFiltrados : courses;

      itemsARenderizar.forEach(course => {
        const nombre   = course['Producto / Pack'] || '';
        const contado  = formatPrice(course['Precio Total (50% por pago unico)']);
        const cuota3   = formatPrice(course['Opción 3 Cuotas (Mensual)']);
        const cuota6   = formatPrice(course['Opción 6 Cuotas (Mensual)']);
        
        // Nuevos campos leídos directamente de las columnas de tu Sheet
        const incluye  = course['Que cursos incluye?'] || '';
        const subtitulo = course['Subtítulo'] || '';
        const beneficiosCrudos = course['Beneficios Principales'] || '';
        const imgUrl   = course['Imagen'] || 'https://res.cloudinary.com/dlnrsadbc/image/upload/q_auto,f_auto,w_400/v1778980849/logo_hugo_alvigini_transparente_jodgue_z1tldp.webp';
        
        // Convertir los saltos de línea de los beneficios en un listado <ul> profesional
        let beneficiosHTML = '';
        if (beneficiosCrudos) {
          const listaBeneficios = beneficiosCrudos.split('\n').filter(b => b.trim() !== '');
          if (listaBeneficios.length > 0) {
            beneficiosHTML = '<ul class="benefits-list">' + 
              listaBeneficios.map(b => `<li>${b.trim()}</li>`).join('') + 
              '</ul>';
          }
        }

        const safeClass = 'card-' + nombre.replace(/[^a-zA-Z0-9]/g, '_');

        const card = document.createElement('div');
        card.className = `course-card ${safeClass}`;
        card.dataset.nombre = nombre;
        card.onclick = () => selectCourse(nombre);

        card.innerHTML = `
          <span class="selected-badge">✓ SELECCIONADO</span>
          <div class="card-content-grid">
            <img src="${imgUrl}" alt="${nombre}" class="card-img" loading="lazy">
            <div class="card-info">
              <h3>${nombre}</h3>
              ${subtitulo ? `<div class="course-subtitle">${subtitulo}</div>` : ''}
              ${incluye ? `<div class="desc"><strong>Incluye:</strong> ${incluye}</div>` : ''}
              ${beneficiosHTML}
            </div>
          </div>
          
          <div class="payment-options-container">
            <div class="payment-options-title">Elegí tu forma de pago:</div>
            
            <button class="pay-option-btn" onclick="selectModalidad('${nombre.replace(/'/g, "\\'")}', 'Pago Contado (50% OFF)', event)">
              <span>💥 Pago Contado</span>
              <strong>$${contado}</strong>
            </button>
            
            <button class="pay-option-btn" onclick="selectModalidad('${nombre.replace(/'/g, "\\'")}', '3 Cuotas', event)">
              <span>📅 En 3 Cuotas</span>
              <strong>$${cuota3}</strong>
            </button>
            
            <button class="pay-option-btn" onclick="selectModalidad('${nombre.replace(/'/g, "\\'")}', '6 Cuotas', event)">
              <span>📅 En 6 Cuotas</span>
              <strong>$${cuota6}</strong>
            </button>
          </div>
        `;

        packList.appendChild(card);
      });

      container.style.opacity = '0';
      setTimeout(() => {
        container.style.transition = 'opacity 0.25s ease-in-out';
        container.style.opacity = '1';
      }, 50);
    }

    function loadCourses() {
      const script = document.createElement('script');
      script.src = APPSCRIPT_BASE + '?callback=handleCourses';
      script.defer = true; 
      script.onerror = () => {
        document.getElementById('courses-container').innerHTML =
          '<div class="error-message">No se pudieron cargar los datos. Por favor recargá la página.</div>';
      };
      document.body.appendChild(script);
    }

    loadCourses();
</script>
</body>
</html>
