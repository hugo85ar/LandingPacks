    .card-h3{font-size:16px;font-weight:700;line-height:1.15}

<body>

<script>
const SHEET_URL =
  "https://script.google.com/macros/s/AKfycbyxlO60asW5Jc8tHtjtSqk8-tUTSxJwwDZ-i0oN-Jgqn5wsmg7l0a70jFD7rZssUD4IOw/exec";

const WHATSAPP_NUM =
  "5491176529179";

const LOGO_URL =
  "https://res.cloudinary.com/dlnrsadbc/image/upload/q_auto,f_auto,w_320,c_limit/v1789653853/hugo_logo_transparente_epomls.png";

const DRIVE_ID =
  "1NGDJ2pUuDDSM8g9MP6lQaH45KfVe1MPf";

const DRIVE_PREVIEW =
  `https://drive.google.com/file/d/${DRIVE_ID}/preview`;

const DRIVE_VIEW =
  `https://drive.google.com/file/d/${DRIVE_ID}/view`;

const FALLBACK = {
  Pack: "Pack 3",
  "Producto / Pack": "Transformación Total",
  detail: "Curso 01 + 02 + 03 + Sesión 1:1",
  "Subtítulo": "El sistema definitivo para validar sin construir de más. Incluye sesión 1:1.",
  "Que cursos incluye?": "Curso 01 + 02 + 03 + Sesión 1:1",
  "Precio Total (100%)": 897,
  "Precio Total (50% por pago unico)": 448.5,
  "Opción 3 Cuotas (Mensual)": "$256",
  "Opción 6 Cuotas (Mensual)": "$128",
  offerNote: "RECOMENDADO • + SESIÓN 1:1 • 50% OFF",
  imageUrl: LOGO_URL,
  buyUrlContado: "https://checkout.dodopayments.com/buy/pdt_example3",
  buyUrl3Cuotas: "https://checkout.dodopayments.com/buy/pdt_example3_3",
  buyUrl6Cuotas: "https://checkout.dodopayments.com/buy/pdt_example3_6"
};
</script>

<header>
  <div class="header-inner">
    <a href="https://hugo85ar.github.io/catalogo-promociones/" class="btn-volver">← Volver</a>
    <img id="logo-img" alt="Hugo Alvigini" class="logo" />
  </div>
</header>

<section class="hero">
  <div class="flex-1" style="order:2">
    <div class="badge"><span class="dot"></span> 50% OFF CONTADO - SOLO PACK 3</div>
    <h1 class="hero-title">PILETA 3: PACK 3 <span>TRANSFORMACIÓN TOTAL</span></h1>
    <p class="hero-sub">Esta landing muestra solo Pack 3 para la pileta de $2500. Pago único con 50% OFF.</p>
  </div>
  <div style="order:1;display:flex;flex-direction:column;align-items:center">
    <div class="video-wrap"><iframe id="drive-frame" allow="autoplay; fullscreen" allowfullscreen frameborder="0"></iframe></div>
    <a id="drive-link" target="_blank" rel="noopener noreferrer" class="video-link">Si no carga, ver video →</a>
  </div>
</section>

<section style="max-width:1120px;margin:0 auto;padding:0 20px 40px">
  <div class="section-title">Pack seleccionado para Pileta 3</div>
  <div id="packs-container"></div>
</section>

<div class="sticky-bar">
  <div class="sticky-inner">
    <div id="status-msg" class="sticky-status hidden"></div>
    <div id="selected-info" class="sticky-info">Cargando Pack 3...</div>
    <button id="checkout-btn" disabled class="cta">🔒 Completar mi compra</button>
    <button id="wsp-btn" class="wsp-link">¿Tenés dudas? Hablar con Hugo por WhatsApp →</button>
  </div>
</div>

<script>
const packsContainer = document.getElementById('packs-container');
const selectedInfo = document.getElementById('selected-info');
const statusMsg = document.getElementById('status-msg');
const checkoutBtn = document.getElementById('checkout-btn');
const wspBtn = document.getElementById('wsp-btn');
const logoImg = document.getElementById('logo-img');
const driveFrame = document.getElementById('drive-frame');
const driveLink = document.getElementById('drive-link');

let selectedPlan = null;
let selectedUrl = null;
let selectedName = null;
let userName = "";

logoImg.src = LOGO_URL;
driveFrame.src = DRIVE_PREVIEW;
driveLink.href = DRIVE_VIEW;

function formatPrice(v) {
  if (v == null) return "$--";
  const s = String(v).trim();
  return s.includes("$") ? s : "$" + s;
}

function extractPrice(str) {
  const m = String(str).match(/\$[\d,.]+/);
  return m ? m[0] : str;
}

function showStatus(text) {
  statusMsg.textContent = text;
  statusMsg.classList.remove('hidden');
  setTimeout(() => statusMsg.classList.add('hidden'), 2500);
}

function buildData(raw) {
  return {
    codigo: (raw.Pack || "Pack 3").trim(),
    producto: (raw["Producto / Pack"] || "Transformación Total").trim(),
    detail: raw.detail || "Curso 01 + 02 + 03 + Sesión 1:1",
    subtitulo: raw["Subtítulo"] || "El sistema definitivo para validar sin construir de más. Incluye sesión 1:1.",
    incluye: raw["Que cursos incluye?"] || "Curso 01 + 02 + 03 + Sesión 1:1",
    img: raw.imageUrl || LOGO_URL,
    regular: raw["Precio Total (100%)"] || 897,
    promo: raw["Precio Total (50% por pago unico)"] || 448.5,
    cuota3: raw["Opción 3 Cuotas (Mensual)"] || "$256",
    cuota6: raw["Opción 6 Cuotas (Mensual)"] || "$128",
    urlContado: raw.buyUrlContado || "",
    url3: raw.buyUrl3Cuotas || "",
    url6: raw.buyUrl6Cuotas || "",
    nombre: `${(raw.Pack || "Pack 3")} - ${(raw["Producto / Pack"] || "Transformación Total")}`.trim(),
    offerNote: raw.offerNote || "RECOMENDADO • + SESIÓN 1:1 • 50% OFF"
  };
}

function renderPack(p) {
  return `
    <div class="card">
      <span class="card-badge-reco">RECOMENDADO • + SESIÓN 1:1</span>
      <span class="card-selected">✓ SELECCIONADO</span>
      <div class="card-inner">
        <img src="${p.img}" alt="${p.nombre}" class="card-img" />
        <div class="flex-1">
          <h3 class="card-h3">${p.codigo} - ${p.producto}<span class="card-detail">${p.detail}</span></h3>
          <div class="card-sub">${p.subtitulo}</div>
          <div class="card-incluye"><span>Incluye:</span> ${p.incluye}</div>
          <div class="price-box">
            <div><span class="price-real">Valor real: ${formatPrice(p.regular)}</span><span class="price-off">50% OFF</span></div>
            <div class="price-hoy">⚡ HOY 50% OFF Contado: ${formatPrice(p.promo)}</div>
            <div class="price-cuotas">O en cuotas: <strong>3x ${formatPrice(p.cuota3)}</strong> | <strong>6x ${formatPrice(p.cuota6)}</strong></div>
          </div>
          <div style="margin-top:12px;font-size:11px;color:rgba(78,238,216,.80)">✨ ${p.offerNote}</div>
          <div class="pay-section">
            <div class="pay-title">Elegí tu forma de pago:</div>
            <div style="display:flex;flex-direction:column;gap:10px">
              <button onclick="selectPlan('Pago Contado (50% OFF) - ${formatPrice(p.promo)}', '${p.urlContado}')" class="pay-btn ${selectedPlan?.includes('Contado') ? 'active' : ''}"><span>💥 Pago Contado - 50% OFF</span><strong>${formatPrice(p.promo)}</strong></button>
              <button onclick="selectPlan('3 Cuotas de ${formatPrice(p.cuota3)}', '${p.url3}')" class="pay-btn ${selectedPlan?.includes('3 Cuotas') ? 'active' : ''}" style="height:44px"><span>📅 En 3 Cuotas</span><strong>${formatPrice(p.cuota3)} c/u</strong></button>
              <button onclick="selectPlan('6 Cuotas de ${formatPrice(p.cuota6)}', '${p.url6}')" class="pay-btn ${selectedPlan?.includes('6 Cuotas') ? 'active' : ''}" style="height:44px"><span>📅 En 6 Cuotas</span><strong>${formatPrice(p.cuota6)} c/u</strong></button>
            </div>
            <div class="input-box"><div class="input-label">¿Dudas? Nombre (opcional)</div><input type="text" placeholder="Ej: Alejandro" oninput="userName=this.value" class="input-field" /></div>
          </div>
        </div>
      </div>
    </div>
  `;
}

window.selectPlan = function(plan, url) {
  selectedPlan = plan;
  selectedUrl = url;
  selectedName = buildData(FALLBACK).nombre;
  selectedInfo.innerHTML = `Seleccionado: <span style="color:#4EEED8;font-weight:600">${selectedName}</span> <span style="color:rgba(255,255,255,.30)">(${plan})</span>`;
  checkoutBtn.disabled = false;
  const price = extractPrice(plan);
  checkoutBtn.textContent = plan.includes('Contado') ? `🔒 Sí, quiero Pack 3 por ${price}` : `🔒 Completar mi compra - ${plan}`;
  showStatus(`✓ ${selectedName} • ${plan} seleccionado`);
  loadPack(FALLBACK);
};

function loadPack(raw) {
  const p = buildData(raw);
  packsContainer.innerHTML = renderPack(p);
}

async function init() {
  try {
    const res = await fetch(SHEET_URL, { cache: "no-store" });
    const txt = await res.text();
    const data = JSON.parse(txt);
    let list = Array.isArray(data) ? data : [];
    let pack3 = list.find(x => (x.Pack || "").toLowerCase().includes("3")) || FALLBACK;
    loadPack(pack3);
    selectPlan(`Pago Contado (50% OFF) - ${formatPrice(pack3["Precio Total (50% por pago unico)"] || 448.5)}`, pack3.buyUrlContado || FALLBACK.buyUrlContado);
  } catch (e) {
    loadPack(FALLBACK);
    selectPlan(`Pago Contado (50% OFF) - ${formatPrice(FALLBACK["Precio Total (50% por pago unico)"])}`, FALLBACK.buyUrlContado);
  }
}

checkoutBtn.addEventListener('click', () => { if (!selectedUrl) return; window.open(selectedUrl, "_blank"); });
wspBtn.addEventListener('click', () => {
  let text = !selectedPlan ? "Hola Hugo! Estoy viendo el Pack 3 y tengo una duda, me ayudás?" : `Hola Hugo! Me interesa:\n\n*Pack:* ${selectedName}\n*Modalidad:* ${selectedPlan}\n${userName ? `*Nombre:* ${userName}\n` : ""}\nTengo una duda antes de pagar, me ayudás?`;
  window.open(`https://wa.me/${WHATSAPP_NUM}?text=${encodeURIComponent(text)}`, "_blank");
});
init();
</script>
</body>
</html>
