<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pileta 3 - Solo Pack 3</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body class="min-h-screen bg-[#0A1E1E] text-white pb-">

<script>
// CONFIG - TODO VERTICAL
const SHEET_URL =
  "https://script.google.com/macros/s/AKfycbyxlO60asW5Jc8tHtjtSqk8-tUTSxJwwDZ-i0oN-Jgqn5wsmg7l0a70jFD7rZssUD4IOw/exec";

const WHATSAPP_NUM =
  "5491176529179";

const LOGO_URL =
  "https://res.cloudinary.com/dlnrsadbc/image/upload/q_auto,f_auto,w_320,c_limit/v1789653853/hugo_logo_transparente_epomls.png";

const DRIVE_ID = "1NGDJ2pUuDDSM8g9MP6lQaH45KfVe1MPf";
const DRIVE_PREVIEW = `https://drive.google.com/file/d/${DRIVE_ID}/preview`;
const DRIVE_VIEW = `https://drive.google.com/file/d/${DRIVE_ID}/view`;

const FALLBACK_PACKS = [{
  Pack: "Pack 3",
  "Producto / Pack": "Transformación Total",
  detail: "Curso 01 + 02 + 03 + Sesión 1:1",
  "Subtítulo": "El sistema definitivo para validar sin construir de más. Incluye sesión 1:1.",
  "Que cursos incluye?": "Curso 01 + 02 + 03 + Sesión 1:1",
  "Precio Total (100%)": 897,
  "Precio Total (50% por pago unico)": 448.5,
  "Opción 3 Cuotas (Mensual)": "$256",
  "Opción 6 Cuotas (Mensual)": "$128",
  offerNote: "RECOMENDADO • + SESIÓN 1:1 • 50% OFF",
  imageUrl: LOGO_URL,
  buyUrlContado: "https://checkout.dodopayments.com/buy/pdt_example3",
  buyUrl3Cuotas: "https://checkout.dodopayments.com/buy/pdt_example3_3",
  buyUrl6Cuotas: "https://checkout.dodopayments.com/buy/pdt_example3_6"
}];
</script>

<!-- HEADER -->
<header class="w-full border-b border-white/[0.06] sticky top-0 z-20 bg-[#0A1E1E]/85 backdrop-blur-xl">
  <div class="mx-auto max-w- px-5 h- flex items-center justify-between">
    <a href="https://hugo85ar.github.io/catalogo-promociones/" class="text- border border-white/10 rounded-full px-4 h-9 flex items-center">← Volver</a>
    <img id="logo-img" class="h-14 md:h-20" />
  </div>
</header>

<!-- HERO + VIDEO -->
<section class="mx-auto max-w- px-5 pt-12 pb-10">
  <div class="flex flex-col md:flex-row gap-8">
    <div class="flex-1">
      <div class="inline-flex gap-2 px-3 py-1 rounded-full bg-[#4EEED8]/10 border border-[#4EEED8]/20 text- text-[#4EEED8] font-bold mb-5">
        <span class="w-1.5 h-1.5 rounded-full bg-[#4EEED8] animate-pulse"></span>
        50% OFF contado - Solo Pack 3
      </div>
      <h1 class="text- md:text- font-[800] uppercase leading-[0.9]">
        PILETA 3: PACK 3
        <span class="block text-white/40">TRANSFORMACIÓN TOTAL</span>
      </h1>
    </div>
    <div class="w- md:w- aspect-[9/16] rounded- overflow-hidden border border-white/10">
      <iframe id="drive-frame" class="w-full h-full" allowfullscreen></iframe>
    </div>
  </div>
</section>

<!-- PACKS -->
<section class="mx-auto max-w- px-5 pb-10">
  <div id="packs-container" class="flex flex-col gap-5">
    <div class="rounded- bg-[#102E2E] border border-white/10 p-6">Cargando Pack 3...</div>
  </div>
</section>

<!-- STICKY FOOTER -->
<div class="fixed bottom-0 left-0 w-full bg-[#0A1E1E]/95 border-t border-white/10 p-4">
  <div class="mx-auto max-w- text-center">
    <div id="selected-info" class="text-xs text-white/50 mb-2">Seleccioná pago</div>
    <button id="checkout-btn" disabled class="w-full h- rounded-full bg-[#FF5A1F] text-white font-bold disabled:opacity-40">
      🔒 Completar compra
    </button>
  </div>
</div>

<script>
const packsContainer = document.getElementById('packs-container');
const selectedInfo = document.getElementById('selected-info');
const checkoutBtn = document.getElementById('checkout-btn');
const logoImg = document.getElementById('logo-img');
const driveFrame = document.getElementById('drive-frame');

logoImg.src = LOGO_URL;
driveFrame.src = DRIVE_PREVIEW;

let selected = null;

function formatPrice(v) {
  const s = String(v).trim();
  return s.includes("$") ? s : "$" + s;
}

function render(pack) {
  return `
    <div class="relative rounded- border border-[#4EEED8] bg-[#102E2E] p-6">
      <span class="absolute -top-3 left-6 px-3 py-1 rounded-full bg-[#4EEED8] text-[#0A1E1E] text- font-bold">
        RECOMENDADO • + SESIÓN 1:1
      </span>
      <div class="flex gap-5">
        <img src="${pack.imageUrl}" class="w- h- md:w- md:h- rounded-" />
        <div class="flex-1">
          <h3 class="font-bold">${pack.Pack} - ${pack["Producto / Pack"]}</h3>
          <p class="text-sm text-[#4EEED8]">${pack["Subtítulo"]}</p>
          <div class="mt-4 p-3 border border-dashed border-[#4EEED8]/30 rounded-">
            <div class="line-through text-white/30 text-xs">Valor: ${formatPrice(pack["Precio Total (100%)"])}</div>
            <div class="text-[#4EEED8] font-bold">HOY 50% OFF: ${formatPrice(pack["Precio Total (50% por pago unico)"])}</div>
            <div class="text-xs">3x ${pack["Opción 3 Cuotas (Mensual)"]} | 6x ${pack["Opción 6 Cuotas (Mensual)"]}</div>
          </div>
          <div class="mt-4 flex flex-col gap-2">
            <button onclick="selectPack('contado')" class="h- rounded-full bg-[#4EEED8]/15 border border-[#4EEED8] text-[#4EEED8] font-bold">
              💥 Contado ${formatPrice(pack["Precio Total (50% por pago unico)"])}
            </button>
            <button onclick="selectPack('3cuotas')" class="h- rounded-full bg-white/5 border border-white/10">
              📅 3x ${pack["Opción 3 Cuotas (Mensual)"]}
            </button>
            <button onclick="selectPack('6cuotas')" class="h- rounded-full bg-white/5 border border-white/10">
              📅 6x ${pack["Opción 6 Cuotas (Mensual)"]}
            </button>
          </div>
        </div>
      </div>
    </div>
  `;
}

window.selectPack = function(tipo) {
  selected = FALLBACK_PACKS[0];
  let plan = "";
  let url = "";
  if (tipo === 'contado') {
    plan = `Contado ${formatPrice(selected["Precio Total (50% por pago unico)"])}`;
    url = selected.buyUrlContado;
  }
  if (tipo === '3cuotas') {
    plan = `3x ${selected["Opción 3 Cuotas (Mensual)"]}`;
    url = selected.buyUrl3Cuotas;
  }
  if (tipo === '6cuotas') {
    plan = `6x ${selected["Opción 6 Cuotas (Mensual)"]}`;
    url = selected.buyUrl6Cuotas;
  }
  selectedInfo.textContent = `Seleccionado: Pack 3 - ${plan}`;
  checkoutBtn.disabled = false;
  checkoutBtn.textContent = `🔒 Sí, quiero Pack 3 por ${plan}`;
  checkoutBtn.onclick = () => window.open(url, "_blank");
};

async function load() {
  try {
    const res = await fetch(SHEET_URL, { cache: "no-store" });
    const txt = await res.text();
    const data = JSON.parse(txt);
    console.log("SHEET DATA:", data);
    // Tu deploy nuevo ya devuelve solo Pack 3
    packsContainer.innerHTML = render(FALLBACK_PACKS[0]);
  } catch(e) {
    packsContainer.innerHTML = render(FALLBACK_PACKS[0]);
  }
}

load();
</script>
</body>
</html>
