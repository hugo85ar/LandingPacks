<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pileta 3 - Pack 3 Transformación Total</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="min-h-screen bg-[#0A1E1E] text-white pb-">

<script>
// =====================
// CONFIG - TODO VERTICAL
// =====================

const SHEET_URL = 
  "https://script.google.com/macros/s/AKfycbyxlO60asW5Jc8tHtjtSqk8-tUTSxJwwDZ-i0oN-Jgqn5wsmg7l0a70jFD7rZssUD4IOw/exec";

const WHATSAPP_NUM = 
  "5491176529179";

const LOGO_URL = 
  "https://res.cloudinary.com/dlnrsadbc/image/upload/q_auto,f_auto,w_320,c_limit/v1789653853/hugo_logo_transparente_epomls.png";

const DRIVE_ID = 
  "1NGDJ2pUuDDSM8g9MP6lQaH45KfVe1MPf";

const DRIVE_PREVIEW = 
  `https://drive.google.com/file/d/${DRIVE_ID}/preview`;

const DRIVE_VIEW = 
  `https://drive.google.com/file/d/${DRIVE_ID}/view`;

// FALLBACK SOLO PACK 3
const FALLBACK_PACKS = [
  {
    Pack: "Pack 3",
    "Producto / Pack": "Transformación Total",
    "Subtítulo": "El sistema definitivo. Incluye sesión 1:1",
    "Que cursos incluye?": "Curso 01 + 02 + 03 + Sesión 1:1",
    "Precio Total (100%)": 897,
    "Precio Total (50% por pago unico)": 448.5,
    "Opción 3 Cuotas (Mensual)": "$256",
    "Opción 6 Cuotas (Mensual)": "$128",
    buyUrlContado: "https://checkout.dodopayments.com/buy/pdt_example3",
    buyUrl3Cuotas: "https://checkout.dodopayments.com/buy/pdt_example3_3",
    buyUrl6Cuotas: "https://checkout.dodopayments.com/buy/pdt_example3_6",
    imageUrl: LOGO_URL
  }
];
</script>

<header class="w-full border-b border-white/10 sticky top-0 bg-[#0A1E1E]/85 backdrop-blur-xl">
  <div class="mx-auto max-w- px-5 h- flex items-center justify-between">
    <a href="https://hugo85ar.github.io/catalogo-promociones/" class="text-xs border border-white/10 rounded-full px-4 h-9 flex items-center">← Volver</a>
    <img id="logo" class="h-14" />
  </div>
</header>

<section class="mx-auto max-w- px-5 pt-12 pb-10">
  <h1 class="text- md:text- font-[800] uppercase leading-[0.9]">
    PILETA 3: PACK 3
    <span class="block text-white/40">TRANSFORMACIÓN TOTAL</span>
  </h1>
  <div id="packs" class="mt-8 flex flex-col gap-5"></div>
</section>

<div class="fixed bottom-0 left-0 w-full bg-[#0A1E1E]/95 border-t border-white/10 p-4">
  <div class="mx-auto max-w-">
    <div id="info" class="text-xs text-white/50 text-center mb-2">Seleccioná pago</div>
    <button id="checkout" disabled class="w-full h- rounded-full bg-[#FF5A1F] text-white font-bold disabled:opacity-40">
      🔒 Completar compra
    </button>
  </div>
</div>

<script>
// LOGICA VERTICAL

const packsEl = document.getElementById('packs');
const infoEl = document.getElementById('info');
const checkoutEl = document.getElementById('checkout');
const logoEl = document.getElementById('logo');

logoEl.src = LOGO_URL;

let selected = null;

function formatPrice(v) {
  if (!v) return "$--";
  const s = String(v).trim();
  return s.includes("$") ? s : "$" + s;
}

function render() {
  packsEl.innerHTML = FALLBACK_PACKS.map((p, i) => `
    <div class="rounded- border border-[#4EEED8] bg-[#102E2E] p-6">
      <img src="${p.imageUrl}" class="w- h- rounded-" />
      <h3 class="mt-4 font-bold">${p.Pack} - ${p["Producto / Pack"]}</h3>
      <p class="text-sm text-[#4EEED8]">${p["Subtítulo"]}</p>
      <div class="mt-4 p-3 border border-dashed border-[#4EEED8]/30 rounded-">
        <div class="line-through text-white/30 text-xs">Valor real: ${formatPrice(p["Precio Total (100%)"])}</div>
        <div class="text-[#4EEED8] font-bold">HOY 50% OFF: ${formatPrice(p["Precio Total (50% por pago unico)"])}</div>
        <div class="text-xs text-white/50">3x ${p["Opción 3 Cuotas (Mensual)"]} | 6x ${p["Opción 6 Cuotas (Mensual)"]}</div>
      </div>
      <button onclick="selectPack(${i})" class="mt-4 w-full h- rounded-full bg-white/10 border border-white/10">
        Seleccionar este Pack
      </button>
    </div>
  `).join("");
}

window.selectPack = function(i) {
  selected = FALLBACK_PACKS[i];
  infoEl.textContent = `Seleccionado: ${selected.Pack} - ${selected["Producto / Pack"]}`;
  checkoutEl.disabled = false;
  checkoutEl.textContent = `🔒 Sí, quiero ${selected.Pack} por ${formatPrice(selected["Precio Total (50% por pago unico)"])}`;
};

checkoutEl.onclick = () => {
  if (!selected) return;
  window.open(selected.buyUrlContado, "_blank");
};

render();

// FETCH REAL (vertical y legible)
async function loadFromSheet() {
  try {
    const res = await fetch(
      SHEET_URL,
      { method: "GET", cache: "no-store" }
    );
    const txt = await res.text();
    const data = JSON.parse(txt);
    console.log("DATA SHEET:", data);
  } catch (e) {
    console.warn("Usando fallback", e);
  }
}

loadFromSheet();
</script>

</body>
</html>
