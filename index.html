  <script>
  const FACEBOOK_PIXEL_ID = '2189151328193841';
    let pixelCargado = false;
    let tiempoPermitido = false;

    setTimeout(() => {
      tiempoPermitido = true;
    }, 2000);

    function cargarPixelFacebook() {
      if (pixelCargado || !tiempoPermitido) return;
      pixelCargado = true;

      window.removeEventListener('scroll', controlarInteraccion);
      window.removeEventListener('mousemove', controlarInteraccion);
      window.removeEventListener('touchstart', controlarInteraccion);

      !function(f,b,e,v,n,t,s)
      {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};
      if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
      n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t,s)}(window,document,'script',
      'https://connect.facebook.net/en_US/fbevents.js');

      fbq('init', FACEBOOK_PIXEL_ID);
      fbq('track', 'PageView');
    }

    function controlarInteraccion() {
      if (tiempoPermitido) {
        cargarPixelFacebook();
      }
    }

    window.addEventListener('scroll', controlarInteraccion, { passive: true });
    window.addEventListener('mousemove', controlarInteraccion, { passive: true });
    window.addEventListener('touchstart', controlarInteraccion, { passive: true });
    
    setTimeout(cargarPixelFacebook, 4000);
  </script>

  <style>
    :root {
      --primary-blue: #5974ff;
      --action-green: #4CAF50;
      --innovation-purple: #5726B8;
      --dark-background: #0b0b1e;
      --text-light: #ffffff;
      --text-dark: #cccccc;
      --border-radius: 12px;
    }
    
    body {
      font-family: "Open Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      background-color: var(--dark-background);
      color: #ffffff;
      line-height: 1.6;
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    h1, h2, h3 {
      font-family: "Montserrat", sans-serif;
      font-display: swap;
    }

    /* 🔙 BOTÓN VOLVER Y CABECERA DE SECCIÓN */
    .top-bar-container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 25px 20px 10px 20px;
      box-sizing: border-box;
    }

    .btn-volver {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: transparent;
      color: var(--text-light);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 8px 16px;
      border-radius: 8px;
      font-family: "Montserrat", sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-bottom: 20px;
    }

    .btn-volver:hover {
      background: rgba(255, 255, 255, 0.05);
      border-color: var(--primary-blue);
      color: var(--primary-blue);
    }

    .section-title-area h1 {
      font-size: clamp(1.8rem, 4vw, 2.4rem);
      font-weight: 700;
      margin: 0 0 8px 0;
      color: var(--text-light);
    }

    .section-title-area p {
      color: var(--text-dark);
      font-size: 1rem;
      margin: 0;
    }

    /* 💎 LOGO CENTRAL */
    .logo-container-central { 
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      padding: 10px 0;
      margin: 0 auto;
    }

    .logo-hero {
      width: 380px; 
      max-width: 85%; 
      height: auto; 
      display: block;
      filter: drop-shadow(0 0 25px rgba(0, 229, 255, 0.4)); 
      transition: transform 0.3s ease;
    }
    .logo-hero:hover { transform: scale(1.02); }
    
    header.hero-main {
      padding: 25px 0 20px 0;
      background: linear-gradient(135deg, var(--primary-blue), var(--innovation-purple));
      text-align: center;
      border-bottom-left-radius: var(--border-radius);
      border-bottom-right-radius: var(--border-radius);
      margin-bottom: 10px;
    }

    #courses-container {
      width: 100%;
      box-sizing: border-box;
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto;
      flex: 1;
    }

    .main-layout {
      display: flex;
      gap: 40px;
      justify-content: center;
      align-items: flex-start;
      width: 100%;
    }

    .column { flex: 1; min-width: 350px; }

    .section-header h2 {
      font-family: "Montserrat", sans-serif;
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--primary-blue);
      border-bottom: 1px solid rgba(89,116,255,0.3);
      padding-bottom: 8px;
      margin-bottom: 20px;
    }

    .course-card, .skeleton-card {
      background: rgba(26, 26, 58, 0.8);
      border: 2px solid rgba(89, 116, 255, 0.2);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-sizing: border-box;
      min-height: 280px; 
    }

    .course-card {
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      position: relative;
    }

    .course-card:hover {
      transform: translateY(-3px);
      border-color: rgba(89,116,255,0.5);
      box-shadow: 0 8px 24px rgba(89,116,255,0.15);
    }

    .course-card.selected {
      border-color: #7fffb0;
      box-shadow: 0 0 0 3px rgba(127,255,176,0.2), 0 8px 28px rgba(127,255,176,0.15);
      background: rgba(26, 50, 38, 0.85);
    }

    .selected-badge {
      display: none;
      position: absolute;
      top: 12px;
      right: 12px;
      background: #7fffb0;
      color: #0a1e10;
      font-size: 0.7rem;
      font-weight: 700;
      font-family: "Montserrat", sans-serif;
      padding: 3px 9px;
      border-radius: 20px;
      letter-spacing: 0.05em;
    }

    .course-card.selected .selected-badge { display: inline-block; }

    .course-card h3 {
      font-family: "Montserrat", sans-serif;
      color: #a4b3ff;
      margin-top: 0;
      margin-bottom: 8px;
      font-size: 1.05rem;
    }

    .course-card.selected h3 { color: #7fffb0; }

    .course-card .desc {
      font-size: 0.88rem;
      color: var(--text-dark);
      margin-bottom: 16px;
      line-height: 1.55;
    }

    .price-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      font-size: 0.9rem;
    }

    .price-row:last-child { border-bottom: none; }
    .price-row.highlight { color: #7fffb0; font-weight: bold; }
    .price-row .label { color: var(--text-dark); }
    .price-row.highlight .label { color: #7fffb0; }

    .skeleton-line {
      background: #1a1a3a;
      position: relative;
      overflow: hidden;
      border-radius: 4px;
      margin-bottom: 12px;
    }

    .skeleton-line::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        90deg,
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 255, 255, 0.06) 50%,
        rgba(255, 255, 255, 0) 100%
      );
      animation: shimmerGPU 1.5s infinite;
    }
    @keyframes shimmerGPU {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    .sticky-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      z-index: 100;
      padding: 14px 20px;
      background: rgba(11, 11, 30, 0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid rgba(89,116,255,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
      box-sizing: border-box;
    }

    .sticky-bar .selected-label {
      font-size: 0.9rem;
      color: var(--text-dark);
      font-style: italic;
    }

    .sticky-bar .selected-label span {
      color: #7fffb0;
      font-style: normal;
      font-weight: 600;
    }

    .btn-whatsapp {
      background: linear-gradient(135deg, #25D366, #128C7E);
      color: var(--text-light);
      padding: 14px 32px;
      border: none;
      border-radius: var(--border-radius);
      font-family: "Montserrat", sans-serif;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 5px 20px rgba(37,211,102,0.4);
      transition: transform 0.2s, box-shadow 0.2s;
      white-space: nowrap;
    }

    .btn-whatsapp:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(37,211,102,0.5);
    }

    .btn-whatsapp:disabled {
      background: linear-gradient(135deg, #3a3a3a, #222);
      box-shadow: none;
      cursor: not-allowed;
      opacity: 0.6;
    }

    .error-message { text-align: center; padding: 40px; color: #ff6b6b; }

    footer {
      margin-top: auto;
      padding: 30px 0 90px 0; /* Padding extra abajo para que la barra sticky no tape el footer */
      text-align: center;
    }

    .payment-info {
      display: inline-block;
      text-align: center;
      padding: 15px 25px;
      background-color: transparent;
      border: none;
      margin-bottom: 10px;
    }

    .banner-pagos {
      width: 100% !important;
      max-width: 350px !important;
      height: auto !important;
      display: block;
      margin: 0 auto; 
      border: none;
      background: transparent;
    }

    footer > p {
      margin-top: 15px;
      font-size: 0.82rem;
      color: var(--text-dark);
    }

    @media (max-width: 768px) {
      .main-layout { flex-direction: column; align-items: center; gap: 20px; }
      .column { width: 100%; min-width: unset; }
      .sticky-bar { flex-direction: column; gap: 8px; padding: 12px 16px; }
      footer { padding-bottom: 120px; }
    }
  </style>
</head>
<body>

  <header class="hero-main">
    <div class="logo-container-central">
      <img src="https://res.cloudinary.com/dlnrsadbc/image/upload/q_auto,f_auto,w_400/v1778980849/logo_hugo_alvigini_transparente_jodgue_z1tldp.webp"
           alt="HA - Hugo Alvigini" class="logo-hero" fetchpriority="high" width="400" height="100">
    </div>
  </header>

  <!-- 🔙 BARRA DE RETORNO Y TÍTULO DE SECCIÓN -->
  <div class="top-bar-container">
    <a href="../catalogo-promociones/" class="btn-volver">
      ← Volver
    </a>
    <div class="section-title-area">
      <h1>Packs & Programas Integrales</h1>
      <p>Explora los recursos disponibles en esta sección.</p>
    </div>
  </div>

  <main id="courses-container">
    <div class="main-layout">
      <div class="column">
        <div class="section-header"><h2>Programas y Packs Destacados</h2></div>
        <div id="pack-list">
          <div class="skeleton-card"><div class="skeleton-line" style="height:24px; width:70%"></div><div class="skeleton-line" style="height:40px; width:90%"></div><div class="skeleton-line" style="height:20px; width:40%"></div></div>
          <div class="skeleton-card"><div class="skeleton-line" style="height:24px; width:60%"></div><div class="skeleton-line" style="height:40px; width:85%"></div><div class="skeleton-line" style="height:20px; width:40%"></div></div>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <div class="payment-info">
      <div class="flags">
        <img src="https://res.cloudinary.com/dlnrsadbc/image/upload/q_auto,f_auto,w_350/v1778980376/pago_moneda_local_ms2q3z.webp" 
             alt="Pagar en Moneda Local Argentina y Paraguay" 
             class="banner-pagos"
             loading="lazy"
             width="350"
             height="70">
      </div>
    </div>
    <p>&copy; 2026 Huguito Bot. Todos los derechos reservados.</p>
  </footer>

  <div class="sticky-bar">
    <span class="selected-label" id="selected-label">Ningún pack seleccionado</span>
    <button class="btn-whatsapp" id="btn-whatsapp" disabled>
      📲 Consultá por WhatsApp
    </button>
  </div>

 <script>
    const APPSCRIPT_BASE = 'https://script.google.com/macros/s/AKfycbyxlO60asW5Jc8tHtjtSqk8-tUTSxJwwDZ-i0oN-Jgqn5wsmg7l0a70jFD7rZssUD4IOw/exec';
    const WA_NUMBER = '5491176529179';

    let selectedCourse = null;

    function selectCourse(nombre) {
      document.querySelectorAll('.course-card').forEach(c => c.classList.remove('selected'));

      if (selectedCourse === nombre) {
        selectedCourse = null;
        updateStickyBar();
        return;
      }

      selectedCourse = nombre;

      document.querySelectorAll('.course-card').forEach(c => {
        if (c.dataset.nombre === nombre) c.classList.add('selected');
      });

      updateStickyBar();
    }

    function updateStickyBar() {
      const label = document.getElementById('selected-label');
      const btn   = document.getElementById('btn-whatsapp');

      if (!selectedCourse) {
        label.innerHTML = 'Ningún pack seleccionado';
        btn.disabled = true;
        btn.onclick = null;
        return;
      }

      label.innerHTML = `Seleccionado: <span>${selectedCourse}</span>`;
      btn.disabled = false;

      const msg = encodeURIComponent(
        `Hola Hugo! Me interesa inscribirme en "${selectedCourse}". ¿Podés darme más información?`
      );
      const waUrl = `https://wa.me/${WA_NUMBER}?text=${msg}`;

      btn.onclick = () => {
        if (typeof fbq !== 'undefined') fbq('track', 'Lead');
        window.open(waUrl, '_blank');
      };
    }

    function handleCourses(courses) {
      const container = document.getElementById('courses-container');
      if (!courses || courses.error) {
        container.innerHTML = `<div class="error-message">Error al cargar los packs.</div>`;
        return;
      }
      renderCourses(courses);
    }

    function renderCourses(courses) {
      const packList = document.getElementById('pack-list');
      const container = document.getElementById('courses-container');

      if (!Array.isArray(courses) || courses.length === 0) {
        container.innerHTML = `<div class="error-message">No hay packs disponibles por el momento.</div>`;
        return;
      }

      packList.innerHTML = '';

      // Filtramos exclusivamente los que sean packs o programas integrales para esta landing
      const packsFiltrados = courses.filter(course => {
        const esPack = course['Pack'] && course['Pack'].toString().toLowerCase().includes('pack');
        return esPack;
      });

      const itemsARenderizar = packsFiltrados.length > 0 ? packsFiltrados : courses;

      itemsARenderizar.forEach(course => {
        const nombre  = course['Producto / Pack'] || '';
        const desc    = course['Que cursos incluye?'] || 'Consultá los detalles.';
        const contado = course['Precio Total (50% por pago unico)'] || '-';
        const cuota3  = course['Opción 3 Cuotas (Mensual)'] || '-';
        const cuota6  = course['Opción 6 Cuotas (Mensual)'] || '-';

        const card = document.createElement('div');
        card.className = 'course-card';
        card.dataset.nombre = nombre;
        card.onclick = () => selectCourse(nombre);

        card.innerHTML = `
          <span class="selected-badge">✓ SELECCIONADO</span>
          <h3>${nombre}</h3>
          <p class="desc">${desc}</p>
          <div class="price-section">
            <div class="price-row highlight">
              <span class="label">💥 Contado (50% OFF)</span>
              <span class="value">${contado}</span>
            </div>
            <div class="price-row">
              <span class="label">3 Cuotas de</span>
              <span class="value">${cuota3}</span>
            </div>
            <div class="price-row">
              <span class="label">6 Cuotas de</span>
              <span class="value">${cuota6}</span>
            </div>
          </div>
        `;

        packList.appendChild(card);
      });

      container.style.opacity = '0';
      setTimeout(() => {
        container.style.transition = 'opacity 0.25s ease-in-out';
        container.style.opacity = '1';
      }, 50);
    }

    function loadCourses() {
      const script = document.createElement('script');
      script.src = APPSCRIPT_BASE + '?callback=handleCourses';
      script.defer = true; 
      script.onerror = () => {
        document.getElementById('courses-container').innerHTML =
          '<div class="error-message">No se pudieron cargar los datos. Por favor recargá la página.</div>';
      };
      document.body.appendChild(script);
    }

    loadCourses();
</script>
</body>
